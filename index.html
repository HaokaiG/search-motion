                 51, 58, 59, 52, 45, 38, 39, 46,
                 53, 60, 61, 54, 47, 55, 62, 63];
/* Each codebook byte packs three numbers: switch_bits = cb & 3, exp_order =
   (cb >> 2) & 7, rice_order = cb >> 5. Small values get a Rice code, large
   ones exp-Golomb, and the switch between them is where they meet exactly. */
const PR_DC_FIRST = 0xB8;
const PR_DC_CB  = [0x04, 0x28, 0x28, 0x4D, 0x4D, 0x70, 0x70];
const PR_RUN_CB = [0x06, 0x06, 0x05, 0x05, 0x04, 0x29, 0x29, 0x29,
                   0x29, 0x28, 0x28, 0x28, 0x28, 0x28, 0x28, 0x4C];
const PR_LEV_CB = [0x04, 0x0A, 0x05, 0x06, 0x04, 0x28, 0x28, 0x28, 0x28, 0x4C];

/* -- bit writer ----------------------------------------------------------- */
function PRBits(cap){
  this.b = new Uint8Array(cap); this.n = 0; this.acc = 0; this.nb = 0;
}
PRBits.prototype.grow = function(){
  const bigger = new Uint8Array(this.b.length * 2);
  bigger.set(this.b.subarray(0, this.n)); this.b = bigger;
};
PRBits.prototype.put = function(bits, val){      /* bits <= 16 */
  this.acc = ((this.acc << bits) | (val & ((1 << bits) - 1))) >>> 0;
  this.nb += bits;
  while (this.nb >= 8){
    if (this.n >= this.b.length) this.grow();
    this.nb -= 8;
    this.b[this.n++] = (this.acc >>> this.nb) & 255;
  }
  this.acc &= (1 << this.nb) - 1;
};
PRBits.prototype.zeros = function(q){
  while (q > 0){ const k = q > 16 ? 16 : q; this.put(k, 0); q -= k; }
};
PRBits.prototype.flush = function(){             /* pad the last byte with 0s */
  if (this.nb) this.put(8 - this.nb, 0);
  return this.n;
};
/* flush FIRST, then read .b — in `bw.b.subarray(0, bw.flush())` the base is
   resolved before the argument runs, so a growth inside flush() hands back
   the stale, shorter buffer and clamps the last byte off the plane. */
PRBits.prototype.bytes = function(){
  const len = this.flush();
  return this.b.subarray(0, len);
};

/* One codeword. The two branches meet with no gap: the largest Rice value is
   ((s+1) << k) - 1 and the smallest exp-Golomb one is exactly ((s+1) << k),
   which is what makes this the exact inverse of the decoder's reader.      */
/* A codeword has to arrive in ONE fill of the decoder's bit cache, and a
   decoder refuses the frame rather than the codeword when it does not:
   ffmpeg computes exp_order - switch_bits + 2q and bails past MIN_CACHE_BITS,
   which is 25 on the 32-bit reader and 32 on the 64-bit one.

   Every software decoder reachable from this machine is the 64-bit one, so
   anything up to 32 bits read fine here for the whole life of this encoder.
   A hardware Media Engine's window is fixed and narrow, and a codeword it
   cannot pull in one go costs it the REST OF THAT SLICE — which arrives as a
   128x16 band of the frame missing, scattered wherever the content happens
   to be hard-edged. That is "there is real transparency but a significant
   part of the frame is missing", and it is a second conformance bug living
   behind the version-0 one, not a leftover of it.

   Measured before the fix, at 1920 with the flat matrices and qscale 1: 41
   codewords per frame over the limit, widest 27 bits, and EVERY ONE of them
   a DC delta. Never a first DC, never a run, never a level. The reason is
   the codebook: a zero delta selects codebook 0x04, the smallest one there
   is, so a run of flat blocks followed by a hard edge asks the narrowest
   code to carry the widest value. Flat, flat, flat, then the white card's
   edge — which is most of this piece.

   Counted rather than assumed, so the retry above can act on it. */
/* 28, not 25. Apple's own files carry 27-bit codewords and the hardware
   decodes them, so 27 is fine wherever this file can go. The guard stays
   only for a future edit that widens the input range; at 25 it would
   quietly re-encode every q1 frame back to q2. */
const PR_CW_MAX = 28;
let prOverWide = 0;
function prCW(bw, val, cb){
  const s = cb & 3, e = (cb >> 2) & 7, k = cb >> 5;
  const q = val >>> k;
  if (q <= s){                                   /* Rice: q zeros, a 1, k bits */
    bw.zeros(q); bw.put(1, 1);
    if (k) bw.put(k, val & ((1 << k) - 1));
  } else {                                       /* exp-Golomb */
    const V = val + (1 << e) - ((s + 1) << k);
    const w = 32 - Math.clz32(V);
    const lead = w - (e - s);
    if (e - s + 2 * lead > PR_CW_MAX) prOverWide++;
    bw.zeros(lead); bw.put(w, V);
  }
}

/* -- DC: a first absolute value, then deltas with a carried sign ----------
   The sign is a running XOR rather than a bit per value: an even code means
   "same sign as the last one", an odd code means it flipped. Long runs of
   one-way drift therefore cost nothing extra.                            */
function prDCs(bw, lev, nblk){
  let prev = lev[0];
  prCW(bw, prev >= 0 ? prev * 2 : -prev * 2 - 1, PR_DC_FIRST);
  let cbi = 5, sign = 0;
  for (let i = 1; i < nblk; i++){
    const dc = lev[i * 64], delta = dc - prev;
    let code;
    if (delta === 0){ code = 0; }
    else {
      const want = delta < 0 ? -1 : 0, mag = delta < 0 ? -delta : delta;
      code = (want === sign) ? mag * 2 : mag * 2 - 1;
    }
    prCW(bw, code, PR_DC_CB[cbi < 6 ? cbi : 6]);
    if (code) sign ^= -(code & 1); else sign = 0;
    cbi = code; prev = dc;
  }
}

/* -- AC: run/level over the slice, coefficient-major ----------------------
   Position counts across every block in the slice at once — all blocks'
   coefficient 1, then all blocks' coefficient 2 — so a slice of flat blocks
   ends after its DCs and costs nothing.                                   */
function prACs(bw, lev, nblk){
  let run = 4, level = 2, pos = nblk - 1;
  let logn = 0; while ((1 << logn) < nblk) logn++;
  for (let i = 1; i < 64; i++){
    const sc = PR_SCAN[i];
    for (let b = 0; b < nblk; b++){
      const v = lev[(b << 6) + sc];
      if (!v) continue;
      const p = i * nblk + b;
      prCW(bw, p - pos - 1, PR_RUN_CB[run < 15 ? run : 15]);
      run = p - pos - 1;
      const mag = v < 0 ? -v : v;
      prCW(bw, mag - 1, PR_LEV_CB[level < 9 ? level : 9]);
      level = mag;
      bw.put(1, v < 0 ? 1 : 0);
      pos = p;
    }
  }
}

/* -- alpha: run/delta, no transform -------------------------------------- */
/* 16-BIT, the original and verified grammar. An 8-bit variant (type 1,
   Apple's own choice for these frames) was built and put on the M5 — it
   failed identically to the 16-bit files, which retires the alpha WIDTH as
   a suspect and earns the 16-bit path its place back: it is the grammar
   this project proved bit-exact against ffmpeg's reader, sample for
   sample, and the one jetski's hardware-verified build also settled on
   (delta escapes, predictor 0xFFFF — the same choices as here). */
function prAlpha(bw, a, n){
  const DS = 64;                                 /* 1 << (7 - 1) */
  const diff = (cur, prev) => {
    let d = (cur - prev) & 0xFFFF;
    if (d >= 0x10000 - DS) d -= 0x10000;
    if (d === 0 || d < -DS || d > DS){ bw.put(1, 1); bw.put(16, d & 0xFFFF); }
    else { bw.put(1, 0); bw.put(6, (d < 0 ? -d : d) - 1); bw.put(1, d < 0 ? 1 : 0); }
  };
  const runOf = r => {
    if (!r) bw.put(1, 1);
    else if (r < 16){ bw.put(1, 0); bw.put(4, r); }
    else { bw.put(1, 0); bw.put(4, 0); bw.put(11, r); }   /* 15 bits, r < 2048 */
  };
  let prev = 0xFFFF, run = 0;
  diff(a[0], prev); prev = a[0];
  for (let i = 1; i < n; i++){
    if (a[i] === prev){ run++; continue; }
    runOf(run); run = 0;
    diff(a[i], prev); prev = a[i];
  }
  if (run) runOf(run);
  /* THE ONE-BIT TERMINATOR — the whole of "a significant part of the frame
     is missing" on Macs with a ProRes Media Engine, and the reason every
     software check missed it.

     Apple's decoder reads a continuation flag after EVERY diff, the last
     one included: 1 means stop, 0 means a run field follows — 4 bits, and
     11 more if those are zero. ffmpeg's reader happens to break out BEFORE
     that flag when the sample count is reached, so against ffmpeg
     semantics a stream that simply stops after its last diff audits as
     perfect — and against the hardware, its zero padding reads as "run
     field follows" and sends the decoder off the end of the slice's DMA
     window. Slice error, frame damaged.

     Measured on Apple's own encoder output, 9 frames, every slice: after
     a diff-ending stream the padding is ALWAYS a single 1 then zeros —
     including an entire extra byte spent to carry that one bit when the
     diff ended byte-aligned — and after a run-ending stream it is always
     plain zeros. Run-ending slices need nothing, which is why the flat
     second act always decoded and the glow-heavy first act never did. */
  if (!run) bw.put(1, 1);
}

/* -- forward DCT, scaled 4x the orthonormal one ---------------------------
   4x is not a taste: the decoder's own inverse divides by that, so a flat
   block of value V has to arrive as DC = 32V. Samples are offset by 512
   first, which is the same thing as the 0x4000 the DC is quoted against. */
const PR_C = (() => {
  const m = new Float64Array(64);
  for (let u = 0; u < 8; u++)
    for (let x = 0; x < 8; x++)
      m[u * 8 + x] = (u === 0 ? Math.SQRT1_2 : 1) *
                     Math.cos((2 * x + 1) * u * Math.PI / 16) / 2;
  return m;
})();
const PR_TMP = new Float64Array(64);
function prFDCT(src, stride, x0, y0, out, o){
  /* a flat block is the common case here — most of the frame is one colour —
     and it needs no transform at all */
  const first = src[y0 * stride + x0];
  let flat = true;
  for (let r = 0; r < 8 && flat; r++){
    const s = (y0 + r) * stride + x0;
    for (let c = 0; c < 8; c++) if (src[s + c] !== first){ flat = false; break; }
  }
  if (flat){
    out[o] = 4 * 8 * (first - 512);              /* = 32(V - 512) */
    for (let i = 1; i < 64; i++) out[o + i] = 0;
    return 0;
  }
  for (let r = 0; r < 8; r++){                   /* rows */
    const s = (y0 + r) * stride + x0;
    for (let u = 0; u < 8; u++){
      let v = 0;
      for (let c = 0; c < 8; c++) v += PR_C[u * 8 + c] * (src[s + c] - 512);
      PR_TMP[r * 8 + u] = v;
    }
  }
  for (let u = 0; u < 8; u++){                   /* columns */
    for (let vv = 0; vv < 8; vv++){
      let v = 0;
      for (let r = 0; r < 8; r++) v += PR_C[vv * 8 + r] * PR_TMP[r * 8 + u];
      out[o + vv * 8 + u] = 4 * v;
    }
  }
  return 1;
}

/* -- one frame ------------------------------------------------------------
   Planes come in padded up to whole macroblocks; W/H are what the header
   declares, and the decoder crops back to them.                          */
function proresFrameAt(Y, U, V, A, W, H, stride, qscale, fps){
  const mbW = (W + 15) >> 4, mbH = (H + 15) >> 4;
  /* slices are 8 macroblocks wide, halving at the right edge until they fit —
     the decoder halves the same way, so the two agree without being told */
  const slices = [];
  for (let my = 0; my < mbH; my++){
    let mx = 0, n = 8;
    while (mx < mbW){
      while (mbW - mx < n) n >>= 1;
      slices.push([mx, my, n]);
      mx += n;
    }
  }
  const coef = new Float64Array(32 * 64), lev = new Int16Array(32 * 64);
  const av   = new Uint16Array(8 * 256);
  const inv = 1 / (4 * qscale);                  /* default matrices are all 4 */
  const parts = [], sizes = [];
  for (const [mx, my, n] of slices){
    const nblk = n * 4, plane = [];
    for (let pi = 0; pi < 3; pi++){
      const src = pi === 0 ? Y : pi === 1 ? U : V;
      /* Luma walks the four blocks of a macroblock across then down; chroma
         walks them DOWN then across. Not a symmetry worth having, but it is
         the order the decoder puts them back in, and a reference file cannot
         show it up unless its chroma varies inside a macroblock — flat
         quadrants and a grey ramp both hide it completely.                */
      let ac = 0;
      for (let m = 0; m < n; m++)
        for (let sub = 0; sub < 4; sub++)
          ac |= prFDCT(src, stride,
                 (mx + m) * 16 + (pi ? (sub >> 1) : (sub & 1)) * 8,
                 my * 16 + (pi ? (sub & 1) : (sub >> 1)) * 8,
                 coef, ((m << 2) + sub) * 64);
      const step = ac ? 1 : 64;                  /* DCs only when nothing moved */
      for (let i = 0; i < nblk * 64; i += step){
        const q = coef[i] * inv;
        lev[i] = q < 0 ? -((0.5 - q) | 0) : ((q + 0.5) | 0);
      }
      /* 192 bytes a block, not 96: the measured peak was 3,249 on a 3,072
         allocation, so the old size guaranteed mid-slice growth on busy
         frames. Growth is correct now, but rarer is better. */
      const bw = new PRBits(nblk * 192);
      prDCs(bw, lev, nblk);
      if (ac) prACs(bw, lev, nblk);
      plane.push(bw.bytes());
    }
    /* alpha is a plain raster of the slice's 16 x 16n region */
    for (let r = 0; r < 16; r++){
      const s = (my * 16 + r) * stride + mx * 16;
      av.set(A.subarray(s, s + n * 16), r * n * 16);
    }
    const abw = new PRBits(n * 1024);
    prAlpha(abw, av, n * 256);
    const A4 = abw.bytes();
    const hdr = new Uint8Array(8);
    hdr[0] = 8 << 3; hdr[1] = qscale;
    hdr[2] = plane[0].length >> 8; hdr[3] = plane[0].length & 255;
    hdr[4] = plane[1].length >> 8; hdr[5] = plane[1].length & 255;
    hdr[6] = plane[2].length >> 8; hdr[7] = plane[2].length & 255;
    parts.push(hdr, plane[0], plane[1], plane[2], A4);
    sizes.push(8 + plane[0].length + plane[1].length + plane[2].length + A4.length);
  }
  /* assemble: frame header, picture header, the slice size table, the slices */
  let dataLen = 0; for (const s of sizes) dataLen += s;
  /* 148, not 20 — the frame header carries BOTH quantisation matrices
     explicitly rather than relying on the decoder's defaults.

     The short form is legal: with the matrix flags clear a decoder is meant
     to substitute the flat default, which is the all-4 matrix this encoder
     quantises against, and Apple's decoder does exactly that. But no real
     encoder writes it. Apple's own and ffmpeg's prores_ks both emit 148
     bytes with the matrices spelled out — measured, side by side, on files
     from both — which left this the last structural difference between
     these files and every other ProRes 4444 in existence. A decoder is
     only ever exercised against the files the world actually contains, so
     an untested path is a real risk and a needless one to carry when the
     fix costs 128 bytes a frame. Nothing about the IMAGE changes: the
     matrices written are the flat 4s already being used, so the quantiser
     behaves identically and the pixels are bit-for-bit what they were. */
  const FRAME_HDR = 148;
  const picLen = 8 + 2 * sizes.length + dataLen;
  const out = new Uint8Array(8 + FRAME_HDR + picLen);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, out.length);
  out.set([0x69, 0x63, 0x70, 0x66], 4);          /* 'icpf' */
  let o = 8;
  /* VERSION 1, not 0 — and this one is a real conformance bug, found on
     hardware this machine does not have.

     Bitstream version 0 predates 4:4:4 and the alpha channel; version 1 is
     the one that carries them. A SOFTWARE decoder tolerates the mismatch
     and reads the alpha anyway, which is why every check here passed for so
     long: this Mac is a base M1 with no ProRes engine and decodes in
     software. Apple Silicon with a hardware Media Engine validates the
     header strictly and, seeing version < 1, correctly concludes the file
     has no alpha to read and returns every pixel opaque.

     Measured on an M5 Pro through AVAssetReader at 32BGRA, 160x90:
        version 0 -> opaque 14400, semi 0, transparent 0
        version 1 -> opaque 0, semi 7200, transparent 7200
     which is the whole of "transparent on one Mac, row C on another".

     The 148-byte header matters WITH this, not instead of it. A version-1
     frame is expected to carry its quantisation matrices rather than lean
     on the decoder's defaults, and a version-1 header of 20 bytes renders
     incompletely on that hardware — reported. Both halves ship together. */
  dv.setUint16(o, FRAME_HDR); dv.setUint16(o + 2, 1);  /* header size, version */
  out.set([0x61, 0x70, 0x6C, 0x30], o + 4);      /* vendor 'apl0' */
  dv.setUint16(o + 8, W); dv.setUint16(o + 10, H);
  out[o + 12] = 3 << 6;                          /* 4:4:4, progressive */
  /* aspect_ratio_info << 4 | frame_rate_code, and BOTH were 0 — "unknown".
     The container's stts is what actually times playback, so a software
     decoder never needed these and nothing here noticed. A reader that
     believes the BITSTREAM, which is what a hardware decode path does, is
     told the pixels have an unknown shape and the picture an unknown rate,
     and has to invent both. Reported as the file "not rendered in the right
     fps chosen".
     1 = square pixels, which is what this piece is (pasp is 1:1 too).
     The rate codes are the spec's own: 23.976, 24, 25, 29.97, 30, 50,
     59.94, 60. The panel also offers 8 and 12, which the table has no code
     for — those stay 0, honestly unknown, rather than claiming a rate the
     file does not run at. */
  const FRC = { 23.976: 1, 24: 2, 25: 3, 29.97: 4, 30: 5, 50: 6, 59.94: 7, 60: 8 };
  out[o + 13] = (1 << 4) | (FRC[fps] || 0);
  /* 1-13-1: BT.709 primaries, sRGB TRANSFER, BT.709 matrix.
     Primaries and matrix are right as they were — sRGB shares BT.709's
     primaries, and prPlanes uses BT.709's own luma weights, so a decoder
     inverting with matrix 1 gets back exactly what went in. The TRANSFER
     was wrong. The frames come off a canvas, which is sRGB-encoded, and
     nothing here linearises them: what the file carries IS an sRGB curve,
     and declaring BT.709's (a pure ~1.96 power, no linear toe) tells a
     colour-managed reader to undo a curve that was never applied.
     A raw 32BGRA pull never notices — it only runs the matrix — which is
     why every check in this file passed for so long. Measured through a
     COLOUR-MANAGED decode (CoreImage honouring the tag, rendering to
     sRGB), at 1-1-1 against the canvas the same frame came back:
        Google blue  (49,134,255) -> (56,145,255)   +7 +11
        Google red   (252,65,61)  -> (252,74,70)    +9 +9
        yellow       (254,199,0)  -> (254,206,0)    +7
        white        unchanged — the two curves meet at the endpoints,
                     which is why this reads as lifted midtones rather
                     than an overall cast. */
  out[o + 14] = 1; out[o + 15] = 13; out[o + 16] = 1;
  /* alpha_channel_type 2 — 16-bit, matching prAlpha. The high nibble has
     now been every value this investigation could put there (0, 4, and the
     7 Apple's own encoder writes) across files that worked and files that
     did not, without once deciding the outcome: it is noise, and the old
     "reserved must be zero" note here was a theory the canonical encoder
     does not honour. The low nibble is the field that matters. */
  out[o + 17] = 2;                               /* 16-bit alpha */
  /* flags: bit 1 = luma matrix follows, bit 0 = chroma matrix follows, the
     pair ffmpeg reads as `flags & 2` then `flags & 1`. Both are the flat 4
     this encoder already quantises against — 64 bytes each, luma first. */
  out[o + 18] = 0; out[o + 19] = 3;
  out.fill(4, o + 20, o + 20 + 128);
  o += FRAME_HDR;
  out[o] = 8 << 3;                               /* picture header size */
  dv.setUint32(o + 1, picLen);
  dv.setUint16(o + 5, sizes.length);
  out[o + 7] = 3 << 4;                           /* slices 8 mb wide, 1 tall */
  o += 8;
  for (const s of sizes){ dv.setUint16(o, s); o += 2; }
  for (const p of parts){ out.set(p, o); o += p.length; }
  return out;
}

/* qscale 2 is provably enough for every input prPlanes can produce, and the
   proof is worth having rather than a table of frames that happened to pass:
   the packer writes 10-bit video range, Y in [64,940] and chroma in [64,960],
   so the largest DC any block can hold is 32(940-512) and the largest delta
   between two of them is the full swing. Run that through the widest codebook
   at each qscale and the worst codeword in the whole input space comes out at
   27 bits at qscale 1 — over — and exactly 25 at qscale 2, which is the last
   width the decoder accepts, since it rejects on `> MIN_CACHE_BITS`.

   So the retry below should never fire. It is here because "provably" rests
   on that range, and the range is one edit away from someone widening it:
   a full-range packing, a 12-bit path, a different matrix. Re-encoding a
   frame one step coarser costs a second and is silent; shipping a file that
   drops bands on every Mac with a Media Engine is neither. It stops at 8
   because the bound falls with qscale and 3 already has room to spare. */
let PR_QUSED = 0;
function proresFrame(Y, U, V, A, W, H, stride, qscale, fps){
  for (let q = qscale; ; q++){
    prOverWide = 0;
    const out = proresFrameAt(Y, U, V, A, W, H, stride, q, fps);
    PR_QUSED = q;
    if (!prOverWide || q >= 8) return out;
  }
}

/* -- RGBA -> the four planes ---------------------------------------------
   BT.709, video range, which is what ProRes means everywhere it is opened.
   Alpha goes 8 -> 16 bit as v * 257, so opaque is exactly 65535 rather than
   the 65343 a trip through a 10-bit plane leaves behind.

   STRAIGHT — the spec's own convention — because the acceptance test is
   REAL TRANSPARENCY, and the readers that can show transparency at all
   (QuickTime, Finder, Premiere, AE, Resolve) read 4444 straight. Handed
   premultiplied data those scale by alpha a SECOND time, and what that
   looks like on this piece is exactly "a dark glow around the glow motion":
   measured, a canvas pixel of (45,130,255) at alpha 57 stored premultiplied
   as (10,29,57) drew about four times too dark, the halo darkest where the
   glow's alpha is mid-range.

   This question has now crossed the file in both directions and lands here
   for good reason. The other reader is Google AI Studio, whose pipeline
   does not composite the alpha — handed straight data it shows the colour
   planes and the low-alpha tail reads as extra radius. But a reader that
   drops alpha cannot show a transparent export EITHER WAY, so it cannot be
   the acceptance test for one; the MOV serves the readers where
   transparency exists, and the route into a flattener is Transparent OFF,
   which writes alpha 255 on every pixel and so reads the same in both.
   The one concession a transparent file can make to a flattener for free
   is the colour under alpha 0 — see groundFill below the planes.

   Every round of this looked like a glow bug and none of them was: the
   file was fine each time, and the reader assumed the other convention.
   Opaque pixels are identical arithmetic in both, so only Transparent: on
   ever had the question.

   ONE FILE, by request — a transparent export briefly delivered a zip with
   a premultiplied twin for AI Studio's flattener, and it is gone: one .mov,
   straight, transparency being the acceptance test and compositing readers
   being where transparency exists. The measurement that stands behind the
   choice: a flattener that shows the colour planes without compositing
   needs the plane to BE c x alpha while a compositing reader needs c, one
   plane cannot hold both, and shaping the sub-noise-floor tail — the most
   that can be conceded without a straight reader noticing — moved the
   flattener's picture 4.4%. In AI Studio this file's glow will read wide;
   that is the flattener showing colour where alpha would have faded it,
   and k = a8 / 255 below is the one-line premultiplied variant if a
   flattener destination ever needs its own file.

   NO SHAPING. Pure straight, every pixel, and the reasoning is worth
   keeping because a "harmless" shaping was tried here and produced a
   visible fault.
   The tempting observation is that below alpha 32 the canvas hands back
   noise: it stores premultiplied and divides on the way out, so the
   un-premultiplied colour can only land on multiples of 255/a — at alpha 1
   that is 0 or 255 per channel and nothing between, which is why the
   glow's outer tail reads as magenta rather than pink. Easing that colour
   toward zero across the band looks free.
   It is not. A straight reader composites c * a, and c * a / 255 recovers
   the SMOOTH premultiplied value the canvas actually holds — the coarse c
   is not error, it is the exact quotient, and multiplying it by a puts the
   smooth number back. Darkening c therefore darkens real signal: at alpha
   16 the shaping halved it, and over a light background the composite went
   246.8 where it should be 254.5. That deficit, spread around the glow's
   whole soft edge, is a faint dark ring — "a weird slightly not transparent
   glow around the actual gradient glow".
   So the colour goes out untouched. The cost is that a reader which shows
   the colour planes WITHOUT compositing sees the noise at full strength,
   and that the noise does not compress — a straight frame runs about 63%
   larger. Both are the correct price for a compositing reader getting the
   exact picture. */
function prPlanes(rgba, W, H){
  const mbW = (W + 15) >> 4, mbH = (H + 15) >> 4;
  const stride = mbW * 16, rows = mbH * 16, n = stride * rows;
  const Y = new Uint16Array(n), U = new Uint16Array(n),
        V = new Uint16Array(n), A = new Uint16Array(n);
  for (let y = 0; y < H; y++){
    let p = y * W * 4, q = y * stride;
    for (let x = 0; x < W; x++, p += 4, q++){
      const r = rgba[p], g = rgba[p + 1], b = rgba[p + 2];
      const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      Y[q] = (64 + 876 * l / 255 + 0.5) | 0;
      U[q] = (512 + 896 * (b - l) / (255 * 1.8556) + 0.5) | 0;
      V[q] = (512 + 896 * (r - l) / (255 * 1.5748) + 0.5) | 0;
      A[q] = rgba[p + 3] * 257;
    }
    for (let x = W; x < stride; x++){            /* pad right: clamp colour, zero alpha */
      Y[y*stride+x] = Y[y*stride+W-1]; U[y*stride+x] = U[y*stride+W-1];
      V[y*stride+x] = V[y*stride+W-1]; A[y*stride+x] = 0;
    }
  }
  for (let y = H; y < rows; y++){                /* and the bottom: same convention */
    const s = (H - 1) * stride, d = y * stride;
    Y.set(Y.subarray(s, s + stride), d); U.set(U.subarray(s, s + stride), d);
    V.set(V.subarray(s, s + stride), d);
    A.fill(0, d, d + stride);
  }
  return { Y, U, V, A, stride };
}

/* ── the matte, baked into the colour ────────────────────────────────────
   A transparent frame has two halves — colour, and how much of it is
   there — and a reader that shows the colour WITHOUT applying the second
   half sees the glow at full strength over whatever sat under alpha 0.
   That picture has a name in this repo's history: row C, white ground and
   a glow spread far past the bar, and it is what a flattening pipeline
   (AI Studio) and a mis-set editor both produce. The file was never wrong;
   the colour channel simply did not contain the answer on its own.

   Now it does. Every pixel is composited onto the piece's own ground —
   white, and black for piece 2 whose plate lives on black, the same rule
   drawStage uses for an opaque export — while THE ALPHA CHANNEL IS KEPT
   INTACT. Colour = c*a + ground*(1-a), alpha = a. So the colour planes
   alone already read as the piece over its ground, correct falloff and
   all, and a reader that drops the matte now gets the right picture
   instead of row C.

   WHAT IT COSTS, and it is a real cost. This is the "matted" convention:
   the colour is premultiplied against a known ground rather than left
   straight. An editor must be told, or it will composite a second time
   and the soft edges come out too light over anything darker than the
   matte. In After Effects that is Interpret Footage > Main > Alpha >
   Premultiplied - Matted With Color, with the colour set to WHITE for the
   search piece and BLACK for the prompt piece. Premiere and Resolve have
   the same control. One setting, standard everywhere, and it is the price
   of the file being correct in every reader that cannot ask.

   THE WAY BACK is the previous behaviour, which touched only a == 0:
       if (a === 0) rgba[p] = rgba[p+1] = rgba[p+2] = ground;
   That is straight colour, correct in an editor with no setting at all,
   and row C everywhere else. The choice between them is which reader has
   to be configured, and it is now the editor rather than everything. */
/* STRAIGHT's companion: colour under alpha 0 is free to choose (a
   compositing reader multiplies it by exactly 0), so it carries the piece's
   ground rather than the canvas's black. Only a == 0 is touched — at any
   a > 0 the colour is the exact quotient a straight reader multiplies back,
   and shading it is the halo bug this file already had once. */
function groundFill(rgba, ground){
  for (let p = 0; p < rgba.length; p += 4)
    if (rgba[p + 3] === 0)
      rgba[p] = rgba[p + 1] = rgba[p + 2] = ground;
}


/* ══════════════════════════ the MOV around it ════════════════════════════
   Same box grammar as the MP4 next door, so the writer is the same; what
   changes is the brand ('qt  '), the sample entry ('ap4h'), a depth of 32
   because there is an alpha channel to declare, and no sync-sample table at
   all — every ProRes frame is a key frame, and an absent stss says so.   */
function muxMOV(frames, W, H, timescale, delta){
  const n = frames.length, dur = n * delta;
  const ftyp = bx("ftyp", str4("qt  "), b32(0x200), str4("qt  "));
  let mdatLen = 8; for (const f of frames) mdatLen += f.length;
  const mdatHdr = new Uint8Array(8);
  /* Both the mdat size field and stco's offsets are 32 bit, so past 4 GB the
     first would truncate and the second would point into the middle of the
     payload — a file that looks written and plays as garbage. The piece is
     6.8s and a 1920 transparent export is about 205 MB, so this is nowhere
     near reachable; it throws rather than corrupts if that ever changes,
     since the fix then is a 64-bit mdat and co64 rather than a smaller W. */
  if (mdatLen > 0xFFFFFFFF)
    throw new Error("movie past 4 GB; needs 64-bit mdat and co64");
  new DataView(mdatHdr.buffer).setUint32(0, mdatLen);
  mdatHdr.set(str4("mdat"), 4);
  /* FASTSTART: moov BEFORE mdat. The layout was ftyp, mdat, moov, which is
     legal and is what a progressive writer produces — but it puts the atom
     that DESCRIBES the movie behind the whole payload, and at 1920 that is
     hundreds of megabytes. Anything that parses while it reads — a browser,
     a web tool, a streaming player — has to fetch to the end before it knows
     the file's shape, and plenty of them simply refuse. Local editors do not
     care, which is why this was invisible until the export had to travel.
     The chicken-and-egg is that stco holds the payload's offset, which
     depends on moov's own size: build it once with a placeholder to learn
     that size, then again with the real number. stco is a fixed-width field,
     so the second build is byte-identical in length — asserted below rather
     than assumed, since a mismatch would corrupt every offset in the file. */
  const build = chunkOffset => {
  const mvhd = bx("mvhd", zeros(4), b32(0), b32(0), b32(timescale), b32(dur),
                      b32(0x00010000), b16(0x0100), zeros(10), MATRIX, zeros(24), b32(2));
  const tkhd = bx("tkhd", new Uint8Array([0,0,0,0x0F]), b32(0), b32(0), b32(1),
                      zeros(4), b32(dur), zeros(8), b16(0), b16(0), b16(0), b16(0),
                      MATRIX, b32(W << 16), b32(H << 16));
  const mdhd = bx("mdhd", zeros(4), b32(0), b32(0), b32(timescale), b32(dur),
                      b16(0x55c4), b16(0));
  const hdlr = bx("hdlr", zeros(4), zeros(4), str4("vide"), zeros(12),
                      new Uint8Array([...str4("VideoHandler"), 0]));
  const vmhd = bx("vmhd", new Uint8Array([0,0,0,1]), zeros(8));
  const dinf = bx("dinf", bx("dref", zeros(4), b32(1),
                                     bx("url ", new Uint8Array([0,0,0,1]))));
  /* the codec's own name, not this piece's. QuickLook, Finder and
     AVFoundation match on this string when they report the codec and its
     32-bit alpha; a bespoke name is a needless difference from every other
     ProRes file, the same reasoning as the long frame header. */
  const name = "Apple ProRes 4444";
  const cname = new Uint8Array(32); cname[0] = name.length;
  cname.set(str4(name), 1);
  const ap4h = bx("ap4h", zeros(6), b16(1), zeros(16), b16(W), b16(H),
                      b32(0x00480000), b32(0x00480000), zeros(4), b16(1),
                      cname, b16(0x0020),                 /* 32-bit: has alpha */
                      new Uint8Array([0xFF, 0xFF]),
                      /* 'nclc', the QuickTime form, NOT the ISO 'nclx'.
                         nclx carries a full_range_flag that nclc cannot, and
                         that extra field was briefly written here — Apple read
                         it fine. But it broke the rule the long frame header
                         was adopted to follow: match what real encoders
                         actually emit. Apple's own encoder and ffmpeg both
                         write nclc in a .mov, and being the only .mov in the
                         world carrying nclx is exactly the untested path that
                         rule exists to avoid. Range goes back to convention —
                         ProRes Y'CbCr is video range, which every ProRes
                         decoder assumes — and the file stops being unusual. */
                      /* transfer 13 (IEC 61966-2-1, sRGB), not 1 — see the
                         frame header's own note. The atom stays nclc, the
                         QuickTime form Apple's encoder and ffmpeg both
                         write in a .mov; only the middle field moves. */
                      bx("colr", str4("nclc"), b16(1), b16(13), b16(1)),
                      bx("fiel", new Uint8Array([1, 0])),
                      bx("pasp", b32(1), b32(1)));
  const stsd = bx("stsd", zeros(4), b32(1), ap4h);
  const stts = bx("stts", zeros(4), b32(1), b32(n), b32(delta));
  /* every ProRes frame is intra, so every sample is a sync sample; stss says
     so explicitly rather than leaving it to the reader's default */
  const stss = bx("stss", zeros(4), b32(n), ...frames.map((_, i) => b32(i + 1)));
  const stsc = bx("stsc", zeros(4), b32(1), b32(1), b32(n), b32(1));
  const stsz = bx("stsz", zeros(4), b32(0), b32(n), ...frames.map(f => b32(f.length)));
  const stco = bx("stco", zeros(4), b32(1), b32(chunkOffset));
  const moov = bx("moov", mvhd,
                      bx("trak", tkhd,
                             bx("mdia", mdhd, hdlr,
                                    bx("minf", vmhd, dinf,
                                           bx("stbl", stsd, stts, stss, stsc, stsz, stco)))));
    return moov;
  };
  const probe = build(0);
  const moov  = build(ftyp.length + probe.length + 8);
  if (moov.length !== probe.length)
    throw new Error("moov size moved with the offset; stco would be wrong");
  /* the parts, not one buffer: at 1920 this movie runs to hundreds of
     megabytes and Blob will take the pieces, so nothing has to hold a
     second copy of all of it at once */
  return [ftyp, moov, mdatHdr, ...frames];
}

/* 1 again — the q2 detour is over, and the reasoning deserves recording.
   qscale 2 was adopted to keep every DC codeword inside a 25-bit window,
   the limit ffmpeg's 32-bit reader enforces. Then Apple's own encoder's
   file — which the M5 hardware plays perfectly — was measured carrying
   247 codewords of 27 bits in three frames: hardware accepts them, and the
   width theory was wrong. At q1 with the flat matrices the quantiser rounds
   each coefficient to the nearest integer and nothing else, which is the
   mastering setting this export always intended. */
const PR_QSCALE = 1;
document.getElementById("vexport").onclick = async () => {
  if (busy) return;
  const W = +document.getElementById("gw").value;
  const H = Math.round(W * 1080 / 1920);
  const fps = +document.getElementById("gfps").value;
  const step = FPS / fps;
  const segA = segStart();                    // the chosen half
  const n = Math.ceil((segEnd() - segA) / step);
  busy = true;
  const wasHold = hold;
  /* stale per-group opacity caches can swallow DOM writes on the first
     exported frame — reset so every fade recomputes from scratch */
  LINE_GROUPS.forEach(g => { g.op = -1; });
  const cvs = document.createElement("canvas");
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext("2d", { willReadFrequently: true });
  const frames = [];
  let bytes = 0;
  /* The matte, tallied AS IT IS ENCODED. "Is the file transparent" has now
     been asked from three different viewers, and each answers with its own
     ground — QuickTime and Finder composite over black, an editor over its
     timeline, a flattener deletes the matte outright — so the export
     answers for itself instead, from the same pixels the encoder is given,
     wherever the page runs (AI Studio included: same code, same bytes). A
     status line reading "74% clear" IS the transparency, whatever colour a
     player paints behind it. */
  let aZero = 0, aFull = 0, aPart = 0;
  /* the coarsest qscale any frame needed. PR_QSCALE unless the conformance
     retry fired, which on this content it does not — worth printing anyway,
     because a silent re-encode is exactly the kind of thing that should not
     be silent. */
  let qUsed = 0;
  try {
    for (let k = 0; k < n; k++){
      hold = (segA + k * step) / FPS;
      render(hold);
      await bgSeek(hold);
      await drawStage(ctx, W, H, alphaOn);
      const img = ctx.getImageData(0, 0, W, H).data;
      if (alphaOn)
        for (let i = 3; i < img.length; i += 4){
          const av = img[i];
          if (av === 0) aZero++; else if (av === 255) aFull++; else aPart++;
        }
      if (alphaOn) groundFill(img, PIECE === 2 ? 0 : 255);
      const p = prPlanes(img, W, H);
      const fr = proresFrame(p.Y, p.U, p.V, p.A, W, H, p.stride, PR_QSCALE, fps);
      if (PR_QUSED > qUsed) qUsed = PR_QUSED;
      frames.push(fr); bytes += fr.length;
      $gs.textContent = `frame ${k + 1}/${n} · ${(bytes / 1048576).toFixed(0)} MB…`;
      await new Promise(r => setTimeout(r, 0));
    }
    $gs.textContent = "writing…";
    await new Promise(r => setTimeout(r, 16));
    /* 90000 divides every rate on offer exactly EXCEPT the source one, which
       is not a whole number of anything: 23.976 is 24000/1001, and 90000 over
       it is 3753.75, which rounded to 3754 declares 23.9744fps. Small — half a
       millisecond across the whole piece — but it is a wrong number written
       into the file, and the fix is to use the rate's own denominator. */
    const [ts, dt] = fps === 23.976 ? [24000, 1001]
                                    : [90000, Math.round(90000 / fps)];
    const blob = new Blob(muxMOV(frames, W, H, ts, dt),
                          { type: "video/quicktime" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "search-motion.mov";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    /* Which reader this file is for, said at the moment it is written. The
       question has come back three times as "the glow has too much radius in
       AI Studio", and it is never the glow: a transparent frame carries a
       soft tail of bright colour at very low alpha — measured at 320x180,
       2383 pixels, 4.1% of the frame, under alpha 32 — which a compositing
       reader fades to nothing and a flattening reader shows at full strength.
       Turning Transparent off writes alpha 255 on EVERY pixel (measured: min
       and max both 255 across a whole frame), so that file reads identically
       in both, which is the route to a flattener. */
    const aT = aZero + aFull + aPart;
    $gs.textContent = `${n} frames · ${(blob.size / 1048576).toFixed(1)} MB`
      + (alphaOn
         ? " · straight alpha"
           + ` · matte measured: ${Math.round(100 * aZero / aT)}% clear`
           + ` / ${Math.round(100 * aPart / aT)}% soft / ${Math.round(100 * aFull / aT)}% solid`
         : " · opaque, reads the same everywhere")
      + (qUsed > PR_QSCALE ? ` · re-encoded at q${qUsed} for codeword width` : "");
  } catch (e){
    $gs.textContent = "failed: " + (e && e.message ? e.message : e);
  } finally {
    hold = wasHold; busy = false;
    if (hold === null) window.play();
  }
};

/* ══════════════════ PNG sequence, out and back in ═══════════════════════
   A GIF carries 256 colours and one all-or-nothing transparent index, which
   is what a transparent GIF of this piece runs into: the bar's scrim and
   every antialiased edge have to fall one side of a threshold. A PNG has
   the full channel and 8 bits of alpha per pixel, so the sequence is what
   the canvas actually drew rather than an approximation of it. Same
   deterministic render path as every other export.                       */
document.getElementById("pexport").onclick = async () => {
  if (busy) return;
  const W = +document.getElementById("gw").value;
  const H = Math.round(W * 1080 / 1920);
  const fps = +document.getElementById("gfps").value;
  const step = FPS / fps;
  const segA = segStart();
  const n = Math.ceil((segEnd() - segA) / step);
  busy = true;
  const wasHold = hold;
  const cvs = document.createElement("canvas");
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext("2d", { alpha: true });
  const files = [];
  let bytes = 0;
  try {
    for (let k = 0; k < n; k++){
      hold = (segA + k * step) / FPS;
      render(hold);
      await bgSeek(hold);
      await drawStage(ctx, W, H, alphaOn);
      /* the browser's own PNG encoder — lossless, and it keeps the alpha */
      const blob = await new Promise(r => cvs.toBlob(r, "image/png"));
      const buf = new Uint8Array(await blob.arrayBuffer());
      files.push({ name: `search-motion_${String(k + 1).padStart(4, "0")}.png`,
                   bytes: buf });
      bytes += buf.length;
      $gs.textContent = `frame ${k + 1}/${n} · ${(bytes / 1048576).toFixed(0)} MB…`;
      await new Promise(r => setTimeout(r, 0));
    }
    $gs.textContent = "packing…";
    await new Promise(r => setTimeout(r, 16));
    const zip = zipOf(files);
    const blob = new Blob([zip], { type: "application/zip" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = alphaOn ? "search-motion-png-alpha.zip" : "search-motion-png.zip";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $gs.textContent = `${n} PNGs · ${(zip.length / 1048576).toFixed(1)} MB`;
  } catch (e){
    $gs.textContent = "failed: " + (e && e.message ? e.message : e);
  } finally {
    hold = wasHold; busy = false;
    if (hold === null) window.play();
  }
};

});
document.getElementById("seg2").addEventListener("change", e => {

});

/* Wrap each quote where it occurs in the body. A quote that is not in the body

function n3Markup(){

     plate's wall has a clear empty band at y 797..1010 where the answer's

  const body = N2_BODY.split(/\n\s*\n/).map(x => x.replace(/\s+/g, " ").trim())

          + '<span class="lit" data-i="' + m.i + '">' + esc(m.q) + '</span>';

function render2(t){

  /* the panel's curve shapes the angle; linear is its default, and it is
     load-bearing there — on the standard decelerate this sweep passes the

     wheel's spectrum at 34..73%, OFF = +10% (+36deg) maps the band onto
