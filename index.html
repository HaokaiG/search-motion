  const pu = sat((f - N2_PRESS) / (N2_PRESS_MS / 1000 * FPS));
  press = seg(pu, BTN_SX);
  const iconX = seg(pu, ICON_SX), iconY = seg(pu, ICON_SY);
  nsend.querySelector("svg").style.transform = `scale(${iconX.toFixed(4)},${iconY.toFixed(4)})`;

  /* the energy blob runs on its own 400ms: linear opacity through .6, and a
     15px lift the whole way on the source's own curve. fill:both, so once it is
     over it stays where it ended rather than snapping back. */
  const eu = sat((f - N2_PRESS) / (N2_ENERGY_MS / 1000 * FPS));
  const eop = ENERGY_PEAK * (eu < 0.125 ? eu / 0.125
                           : eu < 0.625 ? 1
                           : 1 - (eu - 0.625) / 0.375);
  nenergy.style.opacity = (f > N2_PRESS ? eop : 0).toFixed(3);
  nenergy.style.transform =
    `translateY(${(-ENERGY_LIFT * cbez(CB_ENERGY, eu)).toFixed(2)}px)`;
  nsend.style.background = sendCol;
  nsend.style.transform = `scale(${press.toFixed(4)},1)`;
  nsend.querySelector("svg").style.fill = sendInk;

  /* ── act 1 into act 2: the box becomes the chip ── */
  const flash = sat((f - N2_FLASH0) / (N2_FLASH1 - N2_FLASH0));
  n2page.style.opacity = (f >= N2_A3 ? 0 : flash).toFixed(3);
  /* act 1's furniture is not faded — the white page rising over it is what
     takes it out, which is why the plate's context line is still legible at a
     third of the way through and gone at the end */
  n1El.style.opacity = "1";
  n1El.style.visibility = f >= N2_A2 ? "hidden" : "visible";

  /* In the PROMPT half the morph must not start. The half's seam is the click's
     end, but its last exported frame lands on plate 48.60 — a fifth of the way
     into a morph that opens on 48 — and measured there the box had already
     gone rgb(10,10,10) at face 0.35 to rgb(99,99,101) at 0.742, with the glow
     down to 0.841 and the send to 0.699. One frame out of 51, and a loud one
     on a loop, since every other frame of the half is the settled look.
     Held at zero the half stays in whichever look is on — dark or white — for
     its whole length, which is what that half is for. The press is untouched:
     it runs off N2_PRESS on its own clock and finishes inside the half. */
  const promptOnly = SEG2 === "prompt";
  const mt = promptOnly ? 0 : sat((f - N2_MORPH0) / (N2_MORPH1 - N2_MORPH0));
  const inMorph = f > N2_MORPH0 && f < N2_A2;
  /* the rect's own window outlives act 2's arrival — see N2_SETTLE_K */
  const inSettle = !promptOnly && f >= N2_A2 && f < N2_SETTLE_END;
  /* the skin the box starts from — the morph has to lerp out of whichever look
     is on, not out of the dark one it was written against */
  const boxWhite = stage2.classList.contains("box-white");
  const F0 = boxWhite ? [255, 255, 255] : [10, 10, 10];
  const FA0 = boxWhite ? 1 : 0.35;        // the white box is solid, the dark a wash
  const R0 = 57;                          // one radius for both looks
  if (f < N2_A2 || inSettle){
    /* the target is read off act 2's own chip, so editing the prompt re-aims
       the morph instead of leaving it pointing at a baked rectangle */
    const cx = n2chip.offsetLeft, cy = n2chip.offsetTop,
          cw = n2chip.offsetWidth, ch = n2chip.offsetHeight;
    /* the RECT rides the measured exponential; the font and the face below
       stay on the power curve, which is where the clip puts them */
    const ru = promptOnly ? 0 : settle(f);
    const u = promptOnly ? 0
            : Math.pow(sat((f - N2_MOVE0) / (N2_MOVE1 - N2_MOVE0)), N2_MORPH_P);
    const lerp = (a, b) => a + (b - a) * ru;
    nbox.style.left   = lerp(NB_L, cx).toFixed(2) + "px";
    nbox.style.top    = lerp(nbT(), cy).toFixed(2) + "px";
    nbox.style.width  = lerp(NB_W, cw).toFixed(2) + "px";
    nbox.style.height = lerp(nbH(), ch).toFixed(2) + "px";
    /* four corners now, since the chip squares the one nearest the sender */
    nbox.style.borderRadius =
      N2CHIP_R.map(r => lerp(R0, r).toFixed(2) + "px").join(" ");

    /* the face lifts ahead of the move, and the ring and halo go first */
    /* The face reads 0, 149, 211, 234, 240 across f48..52 — as a share of the
       chip's own #F0F1F4 that is 0, .62, .879, .975, 1, which is 1-(1-t)^3.
       Its alpha goes to 1 almost at once: the plate's box is an opaque light
       grey through the morph, not the 35% wash it is while act 1 is running. */
    const face = 1 - Math.pow(1 - mt, 3);
    const fc = i => (F0[i] + ([240, 241, 244][i] - F0[i]) * face).toFixed(0);
    nface.style.background = `rgb(${fc(0)},${fc(1)},${fc(2)})`;
    nface.style.opacity = (FA0 + (1 - FA0) * sat(mt * 4)).toFixed(3);
    /* the halo leaves with the box — and stays if the box is not leaving */
    const ring = promptOnly ? 1 : sat(1 - (f - 48.3) / 1.9);
    nglow.style.opacity = ring.toFixed(3);
    /* Multiply, do not overwrite. The mic rests at 50% and the + at 50% on the
       dark look, and writing a flat 1 here outranked both classes for the whole
       of act 1 — the mic has been rendering opaque against a stylesheet that
       said .5 since it was written. Only the send rests at full. */
    const leave = 1 - sat(mt * 2), dim = boxWhite ? 1 : 0.5;
    nplus.style.opacity  = (leave * dim).toFixed(3);
    nmicEl.style.opacity = (leave * dim).toFixed(3);
    nsend.style.opacity  = leave.toFixed(3);

    /* the query rides the box down into the chip */
    nq.style.fontSize = (44 + (36 - 44) * u).toFixed(2) + "px";
    /* the leading goes with it: the box sets its text at 1.2 and the chat sets
       it at the body's 1.417, so a two-row prompt would otherwise arrive with
       its rows 8px tighter than the chip draws them */
    nq.style.lineHeight = (NQ_LH + (N2CHIP_LH - NQ_LH) * u).toFixed(2) + "px";
    /* 24 is the chip's own padding, and once the leading matches, the query's
       line boxes ARE the chip's — so landing on its text is landing on that
       inset, whatever the row count. The 27.5 this used to lerp to was the
       same landing worked out for the box's tighter 1.2 leading and one row;
       both put the first glyph within half a pixel of 318. */
    nq.style.top = (39 + (24 - 39) * u).toFixed(2) + "px";
    nq.style.left = (45.58 + (45 - 45.58) * u).toFixed(2) + "px";
    /* The query does not fade from white to dark, it flips: the plate's text is
       255 against a black face on f48 and 0 against a 151 face on f49, and
       stays 0 while the face keeps lifting to 213 and 236. Lerping the ink
       instead puts it within 19 of the face on that first frame, which reads
       as the text briefly disappearing. */
    /* the flip is only the dark look's — the white box already carries dark type */
    nq.style.color = (boxWhite || face > 0.25) ? "#000" : "#fff";
    /* the caret is not the morph's business — it has been off since the typing
       landed on f35, and an inline opacity here outranks the .off class that
       put it there, which showed it again for a frame */
  }
  /* the box is what is still moving through the tail, so it outlives act 2's
     arrival and draws OVER it until it lands on the chip — #n2 carries
     z-index 4 and the box's own 3 would otherwise put the chrome on top of
     the thing the eye is following. */
  nbox.style.visibility = (f >= N2_SETTLE_END || promptOnly && f >= N2_A2)
                          ? "hidden" : "visible";
  nbox.style.zIndex = inSettle ? "5" : "";

  /* ── act 2 ── */
  const inA2 = f >= N2_A2 && f < N2_A3;
  /* held rather than written here: act 2's EXIT sets n2body's transform too,
     a few lines down, and whichever assignment ran last won. It was the
     exit's, unconditionally, on every frame of the roll-up — so the climb
     measured off the clip never reached the DOM at all and the body simply
     appeared in place. The two compose into one assignment now. */
  let bodyRise = 0;
  n2El.style.opacity = inA2 ? "1" : "0";
  n2El.style.visibility = inA2 ? "visible" : "hidden";
  if (inA2){
    bodyRise = N2_RISE_PX * Math.pow(N2_RISE_K, Math.max(0, f - N2_RISE0));
    n2nav.style.opacity  = sat((f - 55) / 7).toFixed(3);
    /* the chip is the box's landing point, so it stays out of the way until
       the box has landed on it — before N2_SETTLE_END the two would sit on
       top of each other, one moving and one not. */
    n2chip.style.opacity = f >= N2_SETTLE_END ? "1" : "0";
  }

  /* On the way out the page smears sideways, and it is a BOX smear rather than
     a gaussian one — real motion blur is a subject sampled evenly along its
     travel. A gaussian thins as it spreads, so its ink leaves measurement
     within about 50px of the block however wide the sigma; the plate's answer
     is still reading at the frame's edge, and its rows change by 19-21 a frame
     where a gaussian's change decays to 3.

     And the smear is a symptom, not the motion. Measuring the answer's line
     centres on its left half — which stays sharp the whole way — they spread
     from a fixed point: 1.0067 on f80, 1.027 on f81, 1.080, 1.157, 1.304, all
     about y=600 to within 2.2px. The block is SCALING UP, out of frame, and
     each point's blur is its own velocity, which is why the smear grows with x
     while the left edge stays crisp. Fitting the growth gives
     1 + 0.0067*(f-79)^2.25, and the pivot's x is the block's own left margin,
     241 — which is what holds that edge still.

     The chrome does not go with it: the mark measures at 66..137 on every
     frame until it is gone, where scaling about that pivot would have walked
     it 14px by f82. It fades on its own. */
  /* MEASURED, not fitted. The power curve this replaces was read off the
     plate's first four frames and extrapolated, and against
     NFL_NeverKnowEnough_PromptResponse_01_V01_AB_2.mp4 (whose act 3 lands on
     the clip's f10, so clip + 77 = plate frame) it falls behind exactly where
     the move is fastest:

         plate    f80     f81     f82     f83     f84     f85
         clip    1.0065  1.0258  1.0710  1.1548  1.329   1.677
         fitted  1.0067  1.0319  1.0793  1.1516  1.248   1.373

     18% short on the last frame before the cut. The page was still small when
     act 3 replaced it, which is what read as a jump rather than a rush.

     No power or exponential fits the whole run — the per-frame ratio of ln(s)
     climbs from 1.98 to 3.28, steeper than any of them, so the run is quoted
     as what was measured and interpolated between. Past the last frame it
     carries on at that frame's own ratio, 1.262, which is only ever read on
     f86, the single frame between the measurement and the cut. */
  const N2_EXIT_S = [1, 1.0065, 1.0258, 1.0710, 1.1548, 1.329, 1.677];
  const exitS = x => {
    const n = x - 79;
    if (n <= 0) return 1;
    if (n >= N2_EXIT_S.length - 1){
      const last = N2_EXIT_S[N2_EXIT_S.length - 1];
      return last * Math.pow(1.262, n - (N2_EXIT_S.length - 1));
    }
    const i = Math.floor(n), t = n - i;
    return N2_EXIT_S[i] + (N2_EXIT_S[i + 1] - N2_EXIT_S[i]) * t;
  };
  const a2s = exitS(f);
  /* 160, not 148. Solving the pivot out of the clip's own line centres on
     four separate frames — y' = p + s(y - p) — gives 614, 616, 611.5 and
     606.6, so 612 in stage terms against the 600 this used to scale about.
     n2body sits at N2BODY_TOP, so 612 - 452 = 160. Back: 148. */
  n2body.style.transformOrigin = "0px 160px";        // (241,612) in stage terms
  /* the roll-up and the exit's scale, in one place. Order matters: the scale
     is applied about the origin first and the climb rides on top of it, which
     is the same composition the two had when they were fighting over this
     property one frame at a time. */
  const bt = [];
  if (bodyRise > 0.5)  bt.push(`translateY(${bodyRise.toFixed(1)}px)`);
  if (a2s > 1.0005)    bt.push(`scale(${a2s.toFixed(5)})`);
  n2body.style.transform = bt.join(" ");
  /* the blur each frame is how far the block moved in it, averaged over its
     width — the pivot is at its left edge, so the mean arm is half of 1300.
     The two arms are that same growth curve read half a frame either side, so
     for the first half frame of the exit the trailing one is still behind 79,
     where the curve is flat. It has to be CLAMPED there rather than evaluated:
     a fractional power of a negative base is NaN, and that wrote NaN into all
     nine offsets and the blur, dropping the smear out of 79..79.5 entirely.
     Clamped rather than moving the guard to 79.5 — that would start the smear
     half a frame late, and f=79 is where the scale curve was measured. */
  /* read off the SAME curve half a frame either side, so the blur can no
     longer disagree with the motion it is meant to be blurring — the old
     pair restated the power fit's own constants and would have kept the old
     speeds after the curve above changed. The clamp that used to be needed
     for a fractional power of a negative base is gone with it: exitS returns
     1 for anything at or before 79, so both arms are defined everywhere. */
  /* 0.4 of a frame, not a whole one. The arms used to span a full frame,
     which was about right while the scale curve was the slower fit; on the
     measured curve it over-blurs by about 2.5x. Reading the trailing tail —
     how far ink runs past the last solid glyph on the answer's third line —
     the clip gives 5, 10 and 26px on f81..f83 where a full-frame shutter
     gives 12, 29 and 59. That ratio is the shutter: 0.4 of a frame, near
     enough a 144-degree one. Back: 0.5 either side for the full frame. */
  const N2_EXIT_SHUTTER = 0.4;
  const travel = f > 79
    ? 650 * (exitS(f + N2_EXIT_SHUTTER / 2) - exitS(f - N2_EXIT_SHUTTER / 2)) : 0;
  const step = travel / (nsmear2T.length - 1);
  /* reported as a sigma so it is the same quantity the other piece prints and
     the same one act 3 prints: a box of length L has sigma L/sqrt(12) */
  if (travel > 0) smearPx = travel / Math.sqrt(12);
  nsmear2T.forEach((el, k) => el.setAttribute("dx", (k * step).toFixed(1)));
  nsmear2B.setAttribute("stdDeviation", (step / 2).toFixed(2) + " 0");
  const sharp = Math.max(0, 1 - (f - 79) / 11);
  nsmear2M.setAttribute("k2", sharp.toFixed(3));
  nsmear2M.setAttribute("k3", (1 - sharp).toFixed(3));
  /* the whole page smears, chrome included — the nav and mark measure as gone
     by f82 and f84 not because they fade but because they are thin, and a box
     this long dilutes them below reading while the dense answer survives */
  n2body.style.filter = travel > 0 ? "url(#nsmear2)" : "";
  if (inA2){
    n2El.style.opacity = "1";
    /* and it thins as it goes: the plate's frame mean RISES through the exit,
       244.2, 244.8, 245.2, where a block that only scaled would darken it.

       Refitted off the clip. Reading the 0.5th-percentile luminance over the
       body — position-independent, so it survives the block travelling — the
       ink left runs 1.00 .93 .82 .71 .59 .48 .38 across f79..f85, where the
       old curve held 1.00 1.00 .96 .89 .81 .70 .58: about a frame late the
       whole way and an eighth too dark at the cut. It is very nearly linear,
       -0.105 a frame from f79.3, so it is written as one rather than as a
       power that has to be solved to read.
       Back: `1 - 0.55 * Math.pow(sat((f - 80) / 6), 1.5)`. */
    n2body.style.opacity =
      (sat((f - N2_A2) / 2) * sat(1 - (f - 79.3) / 9.5)).toFixed(3);
    n2chrome.style.opacity = (1 - sat((f - 79) / 4)).toFixed(3);
  }

  /* ── act 3 ── */
  const inA3 = f >= N2_A3;
  n3El.style.opacity = inA3 ? "1" : "0";
  n3El.style.visibility = inA3 ? "visible" : "hidden";
  /* it arrives already moving and settles: the lit phrase measures 0.808 of
     its rest width on the first frame and is within a pixel by f96 */
  const a3s = f => 1 - N2_A3_S0 * Math.pow(N2_A3_DECAY, Math.max(0, f - N2_A3));
  const sc = a3s(f);
  n3El.style.transformOrigin = `${N2_A3_OX}px ${N2_A3_OY}px`;
  n3El.style.transform = sc < 0.9995 ? `scale(${sc.toFixed(5)})` : "";
  if (inA3){
    /* One move from where the layout put the first phrase to where it put the
       second. Because both ends are read back off the spans, the distance is
       whatever the copy makes it — the plate's own travel falls out rather
       than being typed in. Both phrases stay lit throughout: they are 1722px
       apart against a 1920px frame, so the one that is not being looked at is
       simply outside it, and nothing has to be switched on or off. */
    const swapE = g => {
      const lo = Math.tanh(N2_SWAP_K * (N2_SWAP0 - N2_MID));
      const hi = Math.tanh(N2_SWAP_K * (N2_SWAP1 - N2_MID));
      const c = Math.min(Math.max(g, N2_SWAP0), N2_SWAP1);
      return (Math.tanh(N2_SWAP_K * (c - N2_MID)) - lo) / (hi - lo);
    };
    const a0 = n3Aim(0), a1 = n3Aim(1), e = swapE(f);
    const tx = a0.x + (a1.x - a0.x) * e, ty = a0.y + (a1.y - a0.y) * e;
    for (const el of n3pages) el.style.transform =
        `translate3d(${tx.toFixed(1)}px,${ty.toFixed(1)}px,0)`;

    /* Only the phrase being looked at is lit. The two are 1693px apart against
       a 1920px frame, so at rest the other one's tail still reaches about 150px
       into the far side — the plate has no lit pixel there. The handover is a
       hard cut on the middle frame rather than a fade, because that is the
       frame the smear is widest on and the plate has nothing above 200 there
       either: it changes under cover rather than dipping to black. */
    const which = f >= N2_MID ? 1 : 0;
    for (const el of [n3tip, n3lit, n3ink])
      for (const sp of el.querySelectorAll(".lit"))
        sp.classList.toggle("on", +sp.dataset.i === which);

    /* The plate never fades the phrase out — on f124 it still carries 5.4% of
       the frame at a mean of 119. What it does is smear: the camera is doing
       350px in that one frame, so the type spreads and its peak drops from 255
       to 192. Drive the smear off the frame's own velocity, so re-timing the
       swap re-blurs it instead of leaving a stale streak behind. */
    /* the swap's own speed, plus whatever the arrival is still doing: the
       first act-3 frames are moving 110px each as the wall grows into place */
    const velSwap = Math.abs(a1.x - a0.x) * (swapE(f + 0.5) - swapE(f - 0.5));
    const velIn = (a3s(f + 0.5) - a3s(f - 0.5)) * 1546;
    const sd = velSwap / 2.5 + velIn / 8;
    nsmearB.setAttribute("stdDeviation", sd.toFixed(1) + " 0");
    panPx = tx; smearPx = sd;
    n3fx.style.filter = sd > 2 ? "url(#nsmear)" : "";

    /* the wheel the ring carried, still turning, now spread along the phrase:
       the near end at one hue and the far end N2_HUE_SPREAD ahead of it */
    /* N2_SPIN, not the panel's glow speed: that dial drives the QUERY BOX's
       sweep only, by request, and this scene keeps its measured rate */
    const h = (N2_HUE_AT160 - (f - 160) * N2_HUE_RATE * N2_SPIN % 360 + 720) % 360;
    const far = (h + N2_HUE_SPREAD) % 360;
    /* Tight and bright, then straight down: banding the plate's settled frame
       puts 2.9% of it above 150 but only 0.2% between 90 and 150, so its halo
       has almost no broad mid-level skirt. Three flat shadows gave that band
       2.9% and ran the frame 3.5 hot; dropping the outer two to low alpha
       lands the frame at 13.8 against the plate's 14.0, with the lit core
       itself matched at 7.12 against 7.19. */
    const glow = c => `0 0 12px hsl(${c},92%,78%), 0 0 30px hsla(${c},95%,58%,.70),`
                    + ` 0 0 88px hsla(${c},95%,50%,.34)`;
    /* the shadow goes on the phrase, never on the page: transparent text still
       casts one, so a shadow set on the page lights the whole wall */
    for (const sp of n3lit.querySelectorAll(".lit"))
      sp.style.textShadow = sp.classList.contains("on") ? glow(far) : "none";
    for (const sp of n3tip.querySelectorAll(".lit"))
      sp.style.textShadow = sp.classList.contains("on") ? glow(h) : "none";
  }

  $t.textContent = T.toFixed(3);
  $p.textContent = Math.round(panPx);
  $s.textContent = smearPx.toFixed(1);
}

/* ── which piece is live ──────────────────────────────────────────────────
   The two share the frame, the clock and every export path; they share no
   markup and no constants. PIECE decides which stage renders, which panel
   groups show, and which duration the loop and the exports run to.     */
let PIECE = 1;
const $piece = document.getElementById("piece");
function pieceDur(){ return PIECE === 2 ? N2_DUR : DUR; }
function pieceFrames(){ return PIECE === 2 ? N2_NF : NF_EFF; }
function applyN2LookBoot(){
  if (typeof $n2box !== "undefined" && $n2box) applyN2Look();
}
function applyPiece(){
  /* the stage stays laid out either way — on piece 2 it is holding the plate */
  stage.style.display = "";
  stage.classList.toggle("plate-only", PIECE === 2);
  stage2.classList.toggle("live", PIECE === 2);
  for (const el of document.querySelectorAll(".p1only")) el.hidden = PIECE === 2;
  for (const el of document.querySelectorAll(".p2only")) el.hidden = PIECE !== 2;
  /* applyN2 rather than n2Build: this is the moment the panel becomes
     visible, and the prompt field's scale and height can only be measured
     once it has layout */
  if (PIECE === 2){ applyN2(); applyN2LookBoot(); }
  /* Coming back to the search piece, re-derive its layout the same way the
     other branch re-derives the prompt's. The query field is inside a p1only
     group, so while the prompt piece is up it has no layout and measures 0
     wide — anything that called applyQuery in that state (the Transparent
     toggle and the footage loader both do) mirrored the field at a negative
     width and the act-2 bubble came back unwrapped. Measuring it again now
     that it is visible is the fix. */
  else applyQuery();
  /* segStart(), not 0. This painted frame 0 whatever segment was selected, so
     switching back with "AI Mode Chat Only" on flashed the opening of act 1 —
     mean 249 against the chat's 254 — for the one frame before the loop
     corrected it. A short flash of the wrong act, and the reason the switch
     looked like it had loaded wrong. */
  const a = segStart() / FPS, b = segEnd() / FPS;
  /* and a held time carries across, so clamp it: the prompt piece runs 8.066s
     against this one's 6.757, and a scrub past the shorter one's end would
     otherwise arrive stuck on its last frame */
  if (hold !== null) hold = Math.min(Math.max(hold, a), b);
  render(hold !== null ? hold : a);
  if (hold === null) window.play();
}
$piece.addEventListener("change", e => { PIECE = +e.target.value; applyPiece(); });

/* ── piece 2's own controls ── */
const $n2q = document.getElementById("n2q"), $n2ctx = document.getElementById("n2ctx"),
      $n2a = document.getElementById("n2a"), $n2q1 = document.getElementById("n2q1"),
      $n2q2 = document.getElementById("n2q2"), $n2warn = document.getElementById("n2warn"),
      $n2size = document.getElementById("n2size"),
      $n2tail = document.getElementById("n2tail"), $n2qwarn = document.getElementById("n2qwarn"),
      $n2box = document.getElementById("n2box"), $n2blur = document.getElementById("n2blur"),
      $n2bare = document.getElementById("n2bare");
$n2a.value = N2_BODY;
/* ── the panel's prompt field wraps where the box wraps ──────────────────
   Both pieces end up with the same promise — what the field shows is what the
   bubble draws — but they get there from opposite ends, because the two
   layouts differ in what is on screen. The search piece's bar is one pill and
   cannot have rows, so nothing rendered can define a break: there the FIELD is
   the authority and the bubble copies it. Here the box is on screen at full
   size, and forcing a 241px panel field's breaks onto a 960px box would end
   its first line at 42 characters where 58 fit. So the box keeps the authority
   and the field is made to agree with it instead.
   Same typeface both ends, so matching the width in EMS matches the break
   positions: 960 over 44 is 21.818em, which at the panel's 241px of inner
   width is an 11.05px field rather than the 12 the other controls wear.
   Checked across 48 prefixes of a 48-word prompt, four words to forty-eight:
   the field and the box break at identical character positions on every one.
   Derived rather than baked, so a wider panel stays a faithful preview — and
   the render never depends on the panel, which is the other half of the point:
   the box wraps at its own width whatever the field is doing. */
/* A hidden field measures 0, and writing that 0 back as a height is what made
   the prompt box open as a sliver: `applyN2` runs at boot, when the piece is
   still 1 and every p2only row is hidden, so `scrollHeight` came back 0 and
   stuck there until the first keystroke re-measured it. Refuse to size an
   element that has no layout, and size it again when the panel is shown. */
function fitField(el){
  if (!el.clientWidth) return;
  el.style.height = "auto";
  /* scrollHeight carries the padding but NOT the border, and these are
     border-box, so handing it straight back left every field two pixels
     short of its own text — one border top and bottom */
  const cs = getComputedStyle(el);
  el.style.height = (el.scrollHeight + parseFloat(cs.borderTopWidth)
                                     + parseFloat(cs.borderBottomWidth)) + "px";
}
const NQ_EM = NQ_W / NQ_SIZE;
function n2FieldScale(){
  const cs = getComputedStyle($n2q);
  const inner = $n2q.clientWidth - parseFloat(cs.paddingLeft)
                                 - parseFloat(cs.paddingRight);
  if (inner <= 0) return;
  /* the weight has to come across too. The panel sets its controls in Medium
     and the box is Regular, and Medium's wider advances broke a long prompt a
     row early — 6 rows in the field against the box's 5 at 223 characters.
     Read off the box rather than written here, so the two cannot drift; the
     size is the CSS pair 960/44 rather than a live read, because the morph
     writes its own font-size onto #nq every frame. */
  $n2q.style.fontWeight = getComputedStyle(nq).fontWeight;
  $n2q.style.fontSize = (inner / NQ_EM).toFixed(3) + "px";
}
function applyN2(){
  n2FieldScale();
  N2_Q = $n2q.value;
  N2_CTX = $n2ctx.value;
  N2_BODY = $n2a.value;
  N2_QUOTES = [$n2q1.value, $n2q2.value];
  N2_TAIL = $n2tail.value;
  n2Build();
  /* Say what act 3 will actually do with these. A phrase that is not in the
     answer is never marked, so it neither bolds on the page nor lights in the
     wall — and the only visible symptom would be a camera that does not move.
     The other half is the wall's line breaks: the swap is a horizontal move,
     so the two phrases have to end up on the same row of it. */
  const body = N2_BODY.replace(/\s+/g, " ");
  const missing = N2_QUOTES.filter(q => q.trim() && !body.includes(q));
  const sp = [0, 1].map(i => n3wall.querySelector('.lit[data-i="' + i + '"]'));
  const split = sp[0] && sp[1] && sp[0].offsetTop !== sp[1].offsetTop;
  $n2qwarn.textContent =
      missing.length ? missing.length + " not in the answer — nothing to light"
    : split          ? "on different rows of the wall — the swap will tilt"
    :                  "";
  fitField($n2q);
  /* the box grows now, so say how far it grew rather than warning that it
     cannot — the row count is the one number that explains both shapes */
  /* and the half's own length, the way the other piece's readout carries it */
  const n2Whole = Math.min(segEnd() / FPS, N2_DUR);
  const n2Half  = n2Whole - segStart() / FPS;
  $n2warn.textContent = `${N2_Q.length} chars`
                      + (N2_ROWS > 1 ? ` \u00b7 ${N2_ROWS} rows` : "")
                      + ` \u00b7 piece ${N2_DUR.toFixed(2)}s`
                      + (SEG2 === "all" ? "" : ` \u00b7 this half ${n2Half.toFixed(2)}s`);
  render(hold !== null ? hold : 0);
}
for (const el of [$n2q, $n2ctx, $n2a, $n2q1, $n2q2, $n2tail]) el.addEventListener("input", applyN2);
/* Two states each, so a switch: the label says what it is now, and clicking
   it is the whole interaction. They were selects, which cost a click to open
   and put three of them across one row narrow enough to truncate the text. */
let boxWhiteOn = false, backdropOn = true, ctxOn = true;
function applyN2Look(){
  stage2.classList.toggle("box-white", boxWhiteOn);
  stage2.classList.toggle("blur", backdropOn);
  /* an ordinary look control, not one that hides itself on the other halves.
     It reads clearest on Prompt Only, which is a plate of the box alone, but
     the whole piece is entitled to run without a previous turn too — and a
     control that appears and disappears with the half is a control nobody
     finds. */
  stage2.classList.toggle("bare", !ctxOn);
  $n2box.textContent  = "Box: " + (boxWhiteOn ? "White" : "Dark Blur");
  $n2blur.textContent = "Backdrop Blur: " + (backdropOn ? "On" : "Off");
  $n2bare.textContent = "Context Line: " + (ctxOn ? "On" : "Off");
  render(hold !== null ? hold : 0);
}
$n2box.onclick  = () => { boxWhiteOn = !boxWhiteOn; applyN2Look(); };
$n2blur.onclick = () => { backdropOn = !backdropOn; applyN2Look(); };
$n2bare.onclick = () => { ctxOn = !ctxOn; applyN2Look(); };
/* the query box's own glow dial, piece 1's shape: field and bar drive each
   other, 0 is real (isFinite, not ||), the hash carries a non-default */
const $g2s = document.getElementById("g2spd"), $g2sn = document.getElementById("g2spdn");
const $g2w = document.getElementById("g2warn");
function setGlow2(v, from){
  const n = +v;
  N2_GLOW_SPEED = clamp(isFinite(n) ? n : 1, 0, 20);
  if (from !== "range")  $g2s.value  = N2_GLOW_SPEED;
  if (from !== "number") $g2sn.value = N2_GLOW_SPEED.toFixed(2);
  const span = (N2_GLOW_F1 - N2_GLOW_F0);
  const eff  = N2_GLOW_SPEED * N2_GLOW_BASE;   // the dial times the 0.35 base
  $g2w.textContent = N2_GLOW_SPEED === 0
      ? "frozen on the bottom-left corner"
    : eff >= 1
      ? `${N2_GLOW_TURN} deg by f${Math.round(N2_GLOW_F0 + span / eff)}`
        + `, then holds`
      : `reaches ${Math.round(N2_GLOW_TURN * cbez(N2_GLOW_BEZ, Math.min(eff, 1)))}`
        + ` of ${N2_GLOW_TURN} deg by the click`;
  if (hold !== null) render(hold);
  const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  N2_GLOW_SPEED === 1 ? h.delete("glow2")
                      : h.set("glow2", N2_GLOW_SPEED.toFixed(2));
  const q = h.toString();
  history.replaceState(null, "", q ? "#" + q : location.pathname);
}
$g2s.addEventListener("input",  () => setGlow2($g2s.value,  "range"));
$g2sn.addEventListener("change", () => {
  setGlow2(Math.round(+$g2sn.value * 100) / 100, "number");
  $g2sn.value = N2_GLOW_SPEED.toFixed(2);
});
const glow2Bez = makeBez({
  canvas: "g2bzc", reset: "g2bzreset", key: "g2bez", ref: N2_GLOW_BEZ_REF,
  get: () => N2_GLOW_BEZ,
  set: v => { N2_GLOW_BEZ = v; },
  after: () => { setGlow2(N2_GLOW_SPEED, "bez");  // the readout quotes the curve
                 if (hold !== null) render(hold); },
});
makeFold("g2bzfold", "g2bzwrap");
$n2size.addEventListener("change", e => {
  for (const el of n3pages){
    el.style.fontSize = e.target.value + "px";
    el.style.lineHeight = (+e.target.value * 1.33) + "px";   // the plate's leading
  }
  render(hold !== null ? hold : 0);
});

/* One button for both states rather than two, half of them always dead. It is
   labelled with what pressing it will do, the way a transport reads. Stop
   holds the frame where it is rather than rewinding: Replay is already the
   control that goes back to the top, and a stop that jumped to zero would
   leave no way to sit on a frame and look at it. */
function syncPP(){
  const b = document.getElementById("pp");
  if (!b) return;
  const held = hold !== null, s = held ? "Play" : "Stop";
  b.dataset.state = held ? "held" : "playing";
  if (b.getAttribute("aria-label") !== s){
    b.setAttribute("aria-label", s);
    b.title = s;
  }
}
document.getElementById("pp").onclick = () => window.toggle();
document.getElementById("replay").onclick = window.play;

/* Space is the transport key everywhere else, so it is one here too. It is
   only taken when the focus has no use for it: inside the prompt and answer
   fields a space is a space, and on a focused button, dropdown or slider the
   browser's own handling is the right one — including on this very button,
   where native activation already does the same thing, so intercepting would
   just fire it twice. preventDefault matters because the panel scrolls and
   space would page it out from under you. */
addEventListener("keydown", e => {
  if (e.code !== "Space" && e.key !== " ") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.isContentEditable ||
            /^(INPUT|TEXTAREA|SELECT|BUTTON|OPTION)$/.test(t.tagName))) return;
  if (busy) return;                  // don't swallow the key during an export
  e.preventDefault();
  window.toggle();
});

function boot(){
  refit();                                   // text metrics must be final first
  if (Q.has("a")) $a.value = Q.get("a");     // #a=… carries edited answer copy
  buildAnswer($a.value);
  if (Q.has("q")) $q.value = Q.get("q");     // #q=… carries an edited query
  if (Q.has("speed")){                       // #speed=… carries the typing rate
    /* SPEED_MIN/MAX, not the bar's own range — the bar stops at 5 and the
       field goes past it, so clamping to the bar would silently cap a
       headless render at 5.                                              */
    TYPE_SPEED = clamp(+Q.get("speed") || 1, SPEED_MIN, SPEED_MAX);
    $ts.value  = TYPE_SPEED;
    $tsn.value = TYPE_SPEED.toFixed(2);
  }
  if (Q.has("cam")){                         // #cam=… the camera's
    CAM_SPEED  = clamp(+Q.get("cam") || 1, CAM_MIN, CAM_MAX);
    $cs.value  = CAM_SPEED;
    $csn.value = CAM_SPEED.toFixed(2);
  }
  if (Q.has("glow")){                        // #glow=… the bar's glow rate
    /* isFinite rather than `|| 1`, for the same reason setGlow uses it: 0 is
       a real setting here and the falsy idiom cannot express it. */
    const gv = +Q.get("glow");
    GLOW_SPEED  = clamp(isFinite(gv) ? gv : GLOW_DEFAULT, GLOW_MIN, GLOW_MAX);
    $gls.value  = GLOW_SPEED;
    $glsn.value = GLOW_SPEED.toFixed(2);
  }
  /* and run the setter either way, the way the scrim and the bubble do. It was
     not called at boot, so the readout under this slider stayed empty until the
     control was first touched — invisible while the default was 1 and the hint
     blanked there anyway, and wrong the moment either of those changed. */
  setGlow(GLOW_SPEED, "boot");
  if (Q.has("scrim")){                       // #scrim=… the bar's plate over footage
    const sv = +Q.get("scrim");
    BAR_SCRIM = clamp(isFinite(sv) ? sv : SCRIM_DEFAULT, 0, 1);
    $sc.value  = BAR_SCRIM;
    $scn.value = BAR_SCRIM.toFixed(2);
  }
  if (Q.has("bubble")){                      // #bubble=… the AI Mode pill's alpha
    const bv = +Q.get("bubble");
    BUBBLE_K   = clamp(isFinite(bv) ? bv : BUBBLE_DEFAULT, 0, 1);
    $bu.value  = BUBBLE_K;
    $bun.value = BUBBLE_K.toFixed(2);
  }
  setScrim(BAR_SCRIM, "boot");               // writes it to the stage either way
  setBubble(BUBBLE_K, "boot");
  if (Q.has("gbez")){                        // #gbez=x1,y1,x2,y2 the glow's
    const d = Q.get("gbez").split(",").map(Number);
    if (d.length === 4 && d.every(isFinite)) GLOW_BEZ = d;
  }
  glowBez.draw();
  if (Q.has("glow2")){                       // #glow2=… the prompt box's sweep
    const gv = +Q.get("glow2");
    N2_GLOW_SPEED = clamp(isFinite(gv) ? gv : 1, 0, 20);
  }
  if (Q.has("g2bez")){                       // #g2bez=x1,y1,x2,y2 its curve
    const d = Q.get("g2bez").split(",").map(Number);
    if (d.length === 4 && d.every(isFinite)) N2_GLOW_BEZ = d;
  }
  glow2Bez.draw();
  setGlow2(N2_GLOW_SPEED, "boot");
  if (Q.has("bez")){                         // #bez=x1,y1,x2,y2
    const d = Q.get("bez").split(",").map(Number);
    if (d.length === 4 && d.every(isFinite)) CAM_BEZ = d;
  }
  setBez(CAM_BEZ);                           // draws the curve, builds the camera
  applyQuery();                              // always: it sizes the bar
  n2Build();                                 // the other piece, ready to switch to
  applyN2();
  render(hold !== null ? hold : 0);
}
boot();
document.fonts.ready.then(boot);             // again once webfonts settle
if (hold === null) window.play(); else syncPP();
</script>
</body>
</html>
