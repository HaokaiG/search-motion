    /* --rule is the colour the divider RESOLVES TO on a white card, and is
       kept as the record of that measurement. Nothing reads it any more:
       .rule draws itself as a darkening instead, so that it keeps its
       relationship to the card while the card is still fading up over
       footage. Editing this value will NOT move the line — the alpha in
       .rule is what to change, and 255 x (1 - a) is the colour it gives. */
    --rule:#ebebeb;
    /* The AI Mode bubble's alpha is these two multiplied. --chip-a0 is what
       the MODE measures — opaque on white, 0.75 over footage or under a
       matte (below) — and --chip-k is the panel's Button bubble control,
       which is a multiplier so that 1.00 means "as measured" in whichever
       mode you are in and changes nothing anywhere. An absolute alpha here
       could not do that: one number cannot be both the opaque white pill
       and the 0.75 one at the same time. */

    /* 1, not 0.975. The trim existed to bring the OLD pair — a 37x33
       sparkle mark and a 41x41 square, sized off a JPEG plate — down to what
       that plate showed. The new pair is measured straight off AIM Chat.svg
       at 1:1 (37x16 and 49x43), so a trim now shrinks them AWAY from the
       reference: at 0.975 they measured back 36.1x15.6 and 47.8x41.9.
       Back: 0.975. */
    --side-icon:1;            /* sidebar icons, against the reference's size */
    --bar-scrim:0.2;          /* black behind the bar over footage or alpha */
    --panel:300px;            /* the side panel's width, subtracted in resize() */

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0d0f;overflow:hidden}
  body{display:grid;place-items:center;font-family:var(--font)}
  /* The stage carries the face itself rather than inheriting it from <body>.
     The GIF export serialises #stage into a foreignObject inside a plain div,
     where there is no <body> for that rule to match — so the whole piece fell
     through the stack to sans-serif, which sets the query ~5% wide and closed
     up the gap to the AI Mode chip in the GIF but not in the preview.     */
  #stage{font-family:var(--font)}

  #fit{position:fixed;left:50%;top:50%;width:1920px;height:1080px;
       transform-origin:50% 50%;margin:-540px 0 0 -960px}
  #stage{position:absolute;inset:0;background:#fff;overflow:hidden;
         /* the source is a 1920x1080 h.264 master */
         contain:strict}

     The plate's own act 1 is a white studio card; the reference clip runs the
     same furniture over live footage instead. Everything below is measured
     off that clip: the bar's fill goes away entirely — the footage reads
     straight through it and only the gradient outline and its glow carry the
     shape — and the query ink turns pure white (sampled 251.8/251.7/251.3
     against the plate's #111). The AI Mode chip stays the light pill it
     already is, which is what the reference shows too.
     Act 2 is untouched: its own white background covers the video as it
     rises, so the footage washes out exactly as it does in the reference. */
  #bgvid,#bgimg{position:absolute;inset:0;width:100%;height:100%;
         object-fit:cover;display:none}
  /* transparent, not black: the export composites the footage UNDER the
     serialised stage, so anything painted here would hide it */
  /* White, not transparent, because the plate now FADES at the click and what
     it fades to has to be the background rather than the page behind the
     stage. The export still needs it transparent — it composites the footage
     UNDER the serialised stage — so stageSVG() forces that for the length of
     the serialise, the same way it hides the video and the still.
     `.has-alpha` below overrides this and stays transparent; it is later in
     the sheet at the same specificity, so alpha wins when both are on.   */
  #stage.has-bg{background:#fff}
  /* Alpha mode wears exactly what footage mode wears — the scrim bar, the
     white Medium query, the 75% chip — but with nothing behind it. Act 2
     keeps its own white card, the same as over footage, where it covers the
     plate as the answer page rises; the transparency is act 1's.        */
  #stage.has-alpha{background:transparent}
  /* Cutting the piece in half leaves the query half ending ON the cut, where
     act 2 has already started showing through the swelling chip. On its own
     that is the cut doing its job; as a half meant to contain only the search
     query it is a glimpse of the wrong thing. So act 2 keeps its white card —
     which is what covers the footage as the page rises, and what makes this
     white rather than transparent over a plate — and loses everything drawn
     on it. Only the picker's query setting does this; the whole piece keeps
     the cut intact.                                                       */
  #stage.seg-query #act2 .row{visibility:hidden}
  /* whichever kind was loaded — only one is ever shown */
  #stage.has-bg.bg-video #bgvid{display:block}
  #stage.has-bg.bg-still #bgimg{display:block}
  /* Over footage the bar is not clear glass — it carries a black scrim, which
     is what keeps white text legible against a busy plate. Measured by
     interpolating the background vertically ACROSS the bar from clean bands
     above and below it, then comparing the interior to that prediction: a
     straight inside/outside comparison is useless here because the scene
     itself changes (bright buildings above, grass below), and it gave 0.65
     one side against 0.83 the other. Interpolated, six frames of the
     reference read 0.287, 0.312, 0.174, 0.100, 0.208, 0.224 — median 0.22.
     The channels come out near enough neutral (0.70/0.65/0.75) to call it
     black rather than a tint. Set to 0.30 by request, which is where the two
     cleanest frames of that set landed anyway — background static and the
     subject clear of the bar's span. Then 0.25, and now 0.2, both by
     request. Worth recording that the last move went TOWARDS the measurement
     rather than away from it: those six frames give a median of 0.216, so
     0.2 is the plate's own reading to within a hundredth, and the 0.30 and
     0.25 before it were the departures. --bar-scrim is the dial, and it is
     also the panel's Bar scrim control, which reads its default from here.

     The scrim sits on `.bar` itself, which is the face across the whole
     pill. It briefly lived on an inset overlay — the source's way of hiding
     the ring's interior — and that left a sliver at the very edge the scrim
     could not reach: over footage it measured 255 for about 2px against the
     face's 191, a bright hairline round the bar. The ring layers are masked
     to the ring now instead, so no overlay is needed and the face runs edge
     to edge. `.barfill` — the border colour — goes transparent with the
     scrim, and the shadow with it. */
  #stage.has-bg .bar, #stage.has-alpha .bar{
                     background:rgba(0,0,0,var(--bar-scrim))}
  #stage.has-bg .barfill, #stage.has-alpha .barfill{background:transparent}
  /* No saturate/brightness lift — the colour stays its own, BY REQUEST. The
     extra passes below are kept: they add DENSITY rather than shifting the
     hue, which is the part that was actually missing over footage. */
  /* ── the gradient reads solid over footage and under a matte ──────────
     Matched to a supplied still of the bar over a match plate, where the
     colour is vivid the whole way along rather than the thin wash it is on
     white. Note this one is BY EYE against that image — unlike the rest of
     this file, there was no frame to sample.
     Opacity is not the lever: `.bargrad`'s is written per frame from the
     burst's own track and is already 1 once the ring is round, and an inline
     style beats a rule anyway. Nor is saturation on its own — swept live it
     gains 1.24x at 1.75 and then FLATTENS, 1.26 at 2.2, 1.27 at 2.8, 1.28 at
     3.5, because the colour is at its ceiling where it is dense and the limit
     where it is thin is ALPHA, which saturate cannot add.
     What the blur takes out is density, so density is what goes back: two
     more passes of the same layer, compositing to 1-(1-a)^3. A
     `saturate(1.9) brightness(1.3)` rode on top of that for a moment and has
     been taken off again by request — the passes make the gradient present
     without touching what colour it is.
     Back: delete the two `.boost` divs from the markup and this rule. */
  .gblur.boost{display:none}
  #stage.has-bg .gblur.boost, #stage.has-alpha .gblur.boost{display:block}
  /* The chip is a solid pill on the plate's white card; over footage the
     plate reads through it. The alpha goes on the FILL, not on the element:
     element opacity would take the label, the spark and the gradient ring
     down with it, and those stay fully opaque — the label is already #1f1f1f
     and the ring runs on its own measured envelope. rgba here is --chip
     (#f5f6f8) at 75%. Sampling the reference's own pill gives ~202/207/212
     over dark footage, which back-solves to roughly 0.78, so 75% sits right
     next to what that clip does.                                         */
  /* rgba is --chip at --chip-a. Two notes. The colour was 245,246,248 here
     while --chip itself had moved to the design file's 244,246,247, so the
     pill was a shade off its own colour in these modes; it is the file's now.
     And the alpha is a variable because the panel drives it — see the Button
     bubble control. This is the RESTING fill only: from the press the value
     is written inline per frame, and that path honours the same alpha. The
     two must agree at litK 0, and they do — both are rgba(244,246,247,A). */
  /* The pill is only 75% there in these two modes, and until now that was
     all it was — footage read straight through it. It gets the design's own
     backdrop blur behind it too, the same 10px piece 2's prompt scrim uses,
     so what shows through is defocused rather than merely dimmed.
     backdrop-filter, not filter: filter would blur the pill's own ink — the
     label and the lens with it — where backdrop-filter blurs only what is
     already painted behind the element and leaves its contents sharp.

     IT DOES NOT REACH THE FOOTAGE IN AN EXPORT, and that is worth knowing
     before trusting the preview. The property itself survives the export
     path — measured with a striped test layer inside the stage, the
     contrast behind the pill fell from 64.7 to 0.7 through drawStage, so
     the serialised foreignObject honours it. What it cannot see is the
     VIDEO: stageSVG hides bgvid and bgimg before serialising, and drawStage
     paints the footage onto the canvas and then composites the stage SVG
     over it. The footage is therefore underneath the SVG rather than inside
     it, and a backdrop-filter can only blur what its own document paints
     behind it.
     So: over footage the preview defocuses the plate behind the pill and
     the exported file does not. In the transparent mode the two agree —
     there is no footage, and what sits behind the pill inside the stage is
     the bar's flat scrim, which has nothing to defocus either way.
     Making the export match would mean blurring the canvas region under the
     chip in drawStage, between bgDrawInto and the drawImage of the stage.
     Back: the --chip-a0 line alone, with no blur. */
  #stage.has-bg .aichip, #stage.has-alpha .aichip{
                     --chip-a0:.75;
                     -webkit-backdrop-filter:blur(10px);
                     backdrop-filter:blur(10px)}
  /* The query steps up to Medium here, but the chip's label does NOT — it is
     Regular in every mode, by request. It was 500 over footage and alpha on
     the reasoning that the pill is only 75% there and the label needed the
     weight; the label is now the plate's 400 throughout instead.        */
  /* the bloom's own opacity, up from the measured .55 — a CSS rule beats the
     presentation attribute on the element, so this is all it takes */

  /* Medium over footage, against 356 on the white card. Measured, not
     assumed: the reference's white query ink runs a mean stem of 7.74 at its
     own scale, and its bar is 165 tall against our 234, so at our 90.95px
     that is 10.98 — against 8.53 for 356, 9.19 for 400 and 11.01 for 500.
     White-on-dark blooms a little in a threshold measure, so read it as "500
     or a shade under", not as evidence for anything heavier.             */
  #stage.has-bg .query, #stage.has-alpha .query{color:#fff;font-weight:500}
  #stage.has-bg #caret, #stage.has-alpha #caret{background:#fff}
  #stage.has-bg .plus i, #stage.has-alpha .plus i{background:#fff}

  /* ============ ACT 1 — the homepage, held on one flat plane ============ */
  /* Children are positioned in "content space": the same pixel grid the
     camera pans across. Camera x is applied to #world only.              */
  #world{position:absolute;inset:0;will-change:transform}
  #plane{position:absolute;left:0;top:0;width:0;height:0}

  .logo{position:absolute;left:900px;top:-180px;width:1400px;height:520px;overflow:visible}

  /* No border and no shadow. SearchBar_20260819.mp4 has neither: profiled
     across the bar's top edge at t=0.30, where the glow is down at the
     bottom, all three columns read luminance 255 with saturation 0 — the
     page is 255, the face is 255, and nothing marks the edge at all. The
     bottom edge does dip to ~200, but at saturation 30-84, so that is the
     COLOURED glow rather than a grey shade. The only thing drawing this bar
     is the bloom around it.
     border-box is global, so dropping the 4px border does not resize the
     bar — the white face simply grows into it.
     Back: `border:4px solid var(--bar-border)` and
     `box-shadow:0 10px 15px -7px rgba(32,33,36,.16)`. */
  /* No shadow. The source hangs one on its border layer, where it fades out
     with the border; here that layer is masked to the ring, which would clip
     the shadow away, and putting it on `.bar` instead made it permanent —
     measured 249 against the page's 255 just outside the bar, on every frame.
     You had already said the clip shows none. Back: the source's
     `0 4px 18px -2px` scaled by 2.089, on `.bar`. */
  .bar{position:absolute;left:328px;top:420px;width:2547px;height:234px;
       background:#fff;border-radius:117px}
  /* ── the plate's ring, built the way the source builds it ────────────
     A solid fill in the border colour, the gradient over it, and a solid
     overlay inset by the border width. Everything inside that inset is
     covered, so the only thing either layer can show is the ring itself —
     which is why this reads as an OUTLINE that changes colour rather than a
     glow around the pill, and why the border and the gradient can simply
     cross-fade.
     One number is scaled: the source's plate is 112 tall and this one is
     234, so k = 2.089, and the 1px border and the blur keyframes are all
     multiplied by it. Everything else — the curves, the angles, the stop
     percentages, the 7 x 1.5 squash — is the source's own and unscaled. */
  /* both ring layers carry the same cut-out: everything but the ring is
     masked away, so neither can paint over the face */
  .barfill{position:absolute;inset:0;border-radius:inherit;box-sizing:border-box;
           padding:2.09px;background:var(--bar-border);
           -webkit-mask:linear-gradient(#000 0 0) content-box,
                        linear-gradient(#000 0 0);
           mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
           -webkit-mask-composite:xor;mask-composite:exclude}
  /* the two angles need a value before the first frame writes one, or the
     conic-gradient that reads them is invalid and the mask does not apply.
     These are the source's own start values. */
  /* Grown past the pill and masked the same way. The growth is what keeps the
     blur's spill: a mask ends at its element's box, so cutting the ring out
     of a pill-sized box would have taken the outer glow with it.
     170 is what the widest blur carries to at three sigma — 20 x 2.716 is
     54.3, and three sigma of that is 163. It tracks K_PLATE and has to: a
     mask ends at its element's box, so too small a bleed slices the glow off
     at a hard edge, which is the recurring cause of a visible limit around a
     glow in this piece. It was 140 at 1x and 260 at 2x.
     The padding is the bleed EXACTLY, not the bleed plus the border width, so
     the excluded content box is the whole pill rather than just its interior.
     That takes the gradient off the bar's edge — BY REQUEST, no gradient
     outline — and leaves only what falls outside it, which is the soft glow.
     Back: 172.09px, the bleed plus the 2.09 border, which keeps the ring. */
  .bargrad{position:absolute;inset:-170px;padding:170px;box-sizing:border-box;
           border-radius:287px;opacity:0;
           --gradient-angle:170deg;--mask-angle:-90deg;
           -webkit-mask:linear-gradient(#000 0 0) content-box,
                        linear-gradient(#000 0 0);
           mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
           -webkit-mask-composite:xor;mask-composite:exclude;
           will-change:--mask-angle,--gradient-angle}
  .bargrad-mask{position:absolute;inset:170px;border-radius:117px}
  .gblur{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
         backface-visibility:hidden;transform:translateZ(0);
         --composit-clip:conic-gradient(#000 30%,transparent 50%,#000 70%)}
  .gblur.tip{filter:blur(2.72px)}   /* the source's 1px, on the same scale */
  .gmask{position:absolute;inset:0;border-radius:inherit;
         -webkit-mask-image:conic-gradient(from var(--mask-angle),
             transparent 0%,transparent 50%,#000 68%,#000 75%,transparent 89%),
             var(--composit-clip);
         mask-image:conic-gradient(from var(--mask-angle),
             transparent 0%,transparent 50%,#000 68%,#000 75%,transparent 89%),
             var(--composit-clip);
         scale:7 1.5;
         -webkit-mask-composite:source-in;mask-composite:intersect}
  .tip .gmask{
         -webkit-mask-image:conic-gradient(from var(--mask-angle),
             transparent 0%,transparent 62%,#000 82%,transparent 89%),
             var(--composit-clip);
         mask-image:conic-gradient(from var(--mask-angle),
             transparent 0%,transparent 62%,#000 82%,transparent 89%),
             var(--composit-clip)}
  .gmask i{position:absolute;inset:0;border-radius:50%;aspect-ratio:1/1;
           translate:0 -50%;inset-block-start:50%;
           rotate:var(--gradient-angle);
           backface-visibility:hidden;transform:translate3d(0,0,0);
           background:conic-gradient(
             #3186ff 34%,#9378ff 37%,#f96bd6 39%,#fc413d 41%,#fc413d 48%,
             #ff6b2b 50%,#fec700 52%,#ffdb0f 56%,#88de42 58%,#0ebc5f 61%,
             #0ebc5f 65%,#2eaab2 70%,#00a9bb 72%,#3186ff 73%,#3186ff 83%,
             #3186ff 100%)}
  /* the face is the bar's own background now — full pill, no inset, so
     there is no edge it cannot reach */

  /* the beam rings the bar from outside, so it needs no box of its own */
  .beam{position:absolute;left:280px;top:370px;width:2660px;height:340px;
        overflow:visible;pointer-events:none}
  .beam .bg{fill:none;stroke-linecap:round}
  /* The chip's halo, on the bar's own construction. Scaled by the chip's
     height the way the source scales by its plate's: 158/112 = 1.411, so the
     ring is 1.41px where the bar's is 2.09, and the blur carries the same
     x1.3 multiplier on top — 1.411 x 1.3 = 1.834. Proportional rather than
     equal, so the smaller control gets the smaller glow; the LOOK is what
     matches, and the rotation is literally shared.
     The bleed is 115: the widest blur here is 20 x 1.834 = 36.7, three sigma
     of which is 110. Same reason as the bar's — a mask ends at its element's
     box, so too small a bleed would slice the spill off at a hard edge.
     Back: a `<svg class="chipring">` with four stroked paths, `#ringBloom`
     and the `#ringOuter` mask. */
  .chipgrad{position:absolute;inset:-115px;padding:116.41px;box-sizing:border-box;
            border-radius:194px;opacity:0;pointer-events:none;
            --gradient-angle:170deg;--mask-angle:-90deg;
            -webkit-mask:linear-gradient(#000 0 0) content-box,
                         linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
            -webkit-mask-composite:xor;mask-composite:exclude}
  .chipgrad-mask{position:absolute;inset:115px;border-radius:79px}
  .chipgrad .gblur.tip{filter:blur(1.83px)}
  /* Its own squash. The shared `7 1.5` is fitted to the BAR's aspect, 10.9;
     the chip's is 2.88, and the same stretch there maps the mask's window
     onto a much shorter piece of the perimeter — the lit arc came out 27
     samples of 180 against the 49 the bottom run needs, so it could never
     cover the bottom whatever its phase. Swept against how much of the
     bottom lights, 2.2 is the best this mask shape reaches: 80%, against 63
     at 1.6, 71 at 3 and 57 at 5. Back: delete this rule to share the bar's. */
  .chipgrad .gmask{scale:2.2 1.5}
  /* A WIDER window than the bar's, by request: more of the button should be
     lit at once so the turn can be slower without reading as a stall. The
     source's window is `transparent 50, black 68..75, transparent 89` — about
     39% of the circle. Opened to 28..99 it lights **57%** of the chip's
     perimeter against the 32% it managed before, measured at 180 points; the
     intermediate widths went 46% at 42/58/80/95 and 54% at 35/50/85/98, and
     going wider still (20/38/92/100) reaches 62% but leaves so little dark
     that the travelling gap stops reading. The sharp-tip layer keeps its own
     narrower core, as it does on the bar.
     Back: delete this rule to share the bar's window. */
  .chipgrad .gmask{
       -webkit-mask-image:conic-gradient(from var(--mask-angle),
           transparent 0%,transparent 28%,#000 44%,#000 88%,transparent 99%),
           var(--composit-clip);
       mask-image:conic-gradient(from var(--mask-angle),
           transparent 0%,transparent 28%,#000 44%,#000 88%,transparent 99%),
           var(--composit-clip)}
  .chipgrad .tip .gmask{
       -webkit-mask-image:conic-gradient(from var(--mask-angle),
           transparent 0%,transparent 44%,#000 72%,transparent 99%),
           var(--composit-clip);
       mask-image:conic-gradient(from var(--mask-angle),
           transparent 0%,transparent 44%,#000 72%,transparent 99%),
           var(--composit-clip)}

  /* ── the bar the G wears ─────────────────────────────────────────────
     With the G in it the bar runs 4.89% over the plate's, by request, and
     the AI Mode button scales with it rather than sitting in a bigger box.
     Everything here is that one factor: the bar 234 -> 245.44 taken about
     its own centre line, so 537 stays 537 and the pill grows 5.72 either
     way; the button 455x158 -> 477.25x165.73 with its radius, padding, gap,
     spark and label all following. The button's outline scales because it
     is an SVG with a viewBox INSIDE the button — its arc lengths are in
     viewBox units, so RING_P and the hues solved against them do not move.
     The rest of the bar's geometry is not CSS and follows in the script:
     CAP_R, CHIP_W, CHIP_TO_CAP and the beam's own y extent.             */
  #stage.icon-g .bar{top:414.28px;height:245.44px;border-radius:122.72px}
  #stage.icon-g .aichip{top:455.13px;width:453.97px;height:165.73px;
            border-radius:82.86px;gap:28.11px;padding-left:55.49px}
  /* the halo follows the G-icon chip's radius; its box is inset-based, so the
     size comes for free and only the corner has to be restated */
  #stage.icon-g .aichip .chipgrad{border-radius:197.86px}
  #stage.icon-g .aichip .chipgrad-mask{border-radius:82.86px}
  #stage.icon-g .aichip svg.spark{width:73.22px;height:73.22px}
  #stage.icon-g .aichip b{font-size:63.35px}

  .plus{position:absolute;left:425px;top:511px;width:58px;height:58px}
  /* Square ends and a lighter ink, both off SearchBar_20260819.mp4.
     The corners are the clip's: profiling ACROSS the very tip of an arm gives
     254,146,73,77,82,208,255 against 254,148,76,73,86,212,254 two rows in —
     the same profile, which a rounded end could not give, since it would
     lighten at the ends of the tip row. So border-radius goes to 0 from 3px.
     The colour is #1f1f1f BY REQUEST, which is also the ink both design files
     use for the AI Mode button's label and lens, so the bar's icon and that
     button now share one value. It went #3c4043 -> #999 (40% of black, asked
     for and then asked back) -> here. Written as a COLOUR rather than an
     opacity throughout: opacity would multiply into the footage and matte
     looks, where this ink is deliberately switched to solid white, and would
     ride into the export's alpha channel as well.
     For reference the clip's own arms measure rgb(79,79,79), 69% of black,
     where #1f1f1f is 88% — darker than the clip, as #3c4043's 76% was
     lighter. Back: #3c4043 and border-radius 3px for the original pair. */
  .plus i{position:absolute;background:#1f1f1f;border-radius:0}
  .plus i:nth-child(1){left:0;top:26px;width:58px;height:6px}
  .plus i:nth-child(2){left:26px;top:0;width:6px;height:58px}
  /* The same slot carrying the G mark instead, measured off the ad's own wide
     shot — the one where the bar sits over the football footage and already
     carries a G. There the bar's outline strokes centre on y 459.5 and 624.5
     (165 tall) with the left cap on x 158.5, and the mark runs x 200…287,
     y 498…585 — 88 square. Its margins in that frame are 38.5 vertical and
     41 left, and 38.5 + 88 + 38.5 makes 165 exactly, which is the check that
     the mark is centred and the reads are sound.
     Our bar is 234, so it all scales by 234/165 = 1.4182: 124.8 tall, 121.9
     wide on the artwork's own 250x256, inset 54.6 top and bottom and 58.1
     left. The plate does NOT use an even margin — the left runs ~6% wider
     than the vertical. Its G is also 0.86 of the AI Mode pill, not equal.
     Then +8.72% by request, taken about the mark's own centre so it grows in
     place: 132.53 x 135.68, which holds the 250x256 aspect.
     Its margins are then set by request rather than measured, and the three
     are now all different. Vertical is what centring in the 245.44 bar
     gives, (245.44 - 135.68) / 2 = 54.88. Horizontal started at 19% over
     that, 65.31, and each side has since been asked for separately: the
     left is that plus 2, so 67.31, and the right is that times 1.167 and
     then 5% again, so 80.03. Against the vertical they run 1.2265 and
     1.4583.
     The right-hand figure is what the mark faces the QUERY across rather
     than an edge of the bar, so it replaces the 73.0 icon-to-text ink gap
     for the G. Being an ink gap it is quoted to the query's ink: the 'h'
     bears 5.596, so the text BOX starts 602.27 to put its first stem 80.03
     clear of the mark.
     The plate uses none of this — its own left inset is 58.1 against 54.6
     vertical, about 6% wider.
     The text-to-chip gap is untouched by all of it: the chip hangs off
     wherever the text ends by CHIP_GAP, so moving the text moves the chip
     with it and the gap between them is the measured 111 either way.     */
  .plus.as-g{left:395.31px;top:469.16px;width:132.53px;height:135.68px;
     background:var(--gmark) center/contain no-repeat}
  .plus.as-g i{display:none}

  /* ink runs 502…584 with the baseline at 566 → 86px type. `top` is set
     from JS so the BASELINE lands on 566 whatever face actually loads.   */
  /* 356, not 400. The subset keeps the wght axis live, and the plate's query
     is measurably lighter than a plain regular. Comparing the same word in
     both panels of the side-by-side — "what", 96x33 on the plate against
     99x34 here, so the same type size — the plate carries 6.6% less ink per
     unit area. Sweeping the axis, that density lands between 350 (0.9234 of
     regular) and 360 (0.9411); 356 interpolates it.
     Held loosely: the comparison is half-res through H.264, and the stem
     metric argues lower still (~334), so the honest range is ~335-356 and
     this takes the blur-robust end. 400 is one edit away.                */
  /* 86.40 is the plate's solved 90.95 taken down 5%, by request. The baseline
     still lands on the measured 566 — alignBaseline sets `top` from whatever
     the face actually does, so it follows the size on its own.            */
  .query{position:absolute;left:516px;top:494px;white-space:pre;
         font-size:86.40px;font-weight:356;line-height:1;color:var(--ink)}
  .query span{vertical-align:baseline}
  #caret{display:inline-block;width:6px;height:80px;background:#111;
         vertical-align:baseline;transform:translateY(9px);margin-left:11px}
  #caret.off{opacity:0}
  /* visibility, not display: the caret's 80px box is taller than the font's
     strut ascent, so removing it from the line box shortens the ascent and
     lifts the whole line 4px the moment typing ends.                    */
  #caret.gone{visibility:hidden}

  /* ── the button, off AIM Button.svg ──────────────────────────────────
     The file is a 260.018 x 94.918 pill on a 47.459 radius — exactly half its
     height, so a true pill — filled #F4F6F7 with #1F1F1F ink. Its parts,
     scaled to this chip's 158 height (x1.6646):
       width                432.8   (was 455)
       padding to icon ink   52.9   (was 59)
       icon ink              69.8   (was 73.2)
       gap, icon to text     26.8   (was 19)
       text ink width       227.6
       pad from text end     55.6
     They add to 432.7, so the parts and the width agree.
     The GAP is the one that was really wrong — 41% out, and the comment that
     used to sit here said so: it was "an eyeball read of a pasted image, not
     a measurement off a frame". This file is that measurement. */
  /* --chip at --chip-a, so the resting pill honours the Button bubble control
     in every mode. It reads as no change on white until the press, where the
     blue arrives and the alpha starts to matter. The has-bg / has-alpha rule
     below overrides only the DEFAULT alpha, not this construction. */
  .aichip{position:absolute;left:2375px;top:459px;width:432.8px;height:158px;
          background:rgba(245,248,255,calc(var(--chip-a0) * var(--chip-k)));
          border-radius:79px;
          /* No shadow. Chip.svg draws the pill as two flat rects with no
             filter and nothing under them, so the drop shadow this used to
             carry is not in the design it is taken from.
             It changes nothing outside the bar: the shadow reached about
             12px (2 offset + 10 blur) and the chip sits 37px clear of the
             bar's bottom edge and 45px of its right, so it only ever fell on
             the bar's own face — measured, not assumed, because the first
             version of this note claimed it had been leaking into the matte
             and that was wrong.
             Back: `box-shadow:0 2px 10px rgba(32,33,36,.10)`. */
          /* Both off Chip.svg, measured with getBBox and scaled by the pill:
             the file's pill is 261.21 wide against this 432.8, so 1.65691 a
             unit. Its icon ink starts 32.54 units in from the pill's left
             edge (53.92px) and its label starts 15.62 units after the icon
             ends (25.88px). Back: 52.9 and 26.8. */
          display:flex;align-items:center;gap:25.88px;padding-left:53.92px;
          transform-origin:50% 50%;will-change:transform,filter}
  /* Box tightened to the artwork bounds, so the plate's ink is the measured
     67x67 px (content x 2433…2500, y 504…571). Run over that by request: 15%
     up, then 5% back off it — 77.05 x 0.95 = 73.2, still 9.2% over the plate.
     The chip is a fixed 455 and everything in it is flex:none, so this comes
     out of the slack rather than reflowing: 59 padding + 73.2 + 19 gap +
     ~239 of label leaves ~64 spare. The 19 is the reference image's own
     proportion — its gap reads about a quarter of its icon's width, against
     the 0.42 this was sitting at — and is an eyeball read of a pasted image,
     not a measurement off a frame, so treat it as approximate.          */
  /* 69.8, the file's own ink: its icon runs 41.94 units on a 94.918 pill,
     which is 69.8 at this height. It had been 73.2 — 15% over the plate by
     request and then 5% back off it, an explicit departure made before this
     file existed. The file supersedes it; put 73.2 back to restore that. */
  /* Nudged up 1.55px because the design file rides the icon high of centre:
     it draws the ink 0.93 units above a 94.918 pill, which is 1.55 here. Flex
     would otherwise centre it, since the viewBox is tight to the ink and the
     element box IS the ink box. The standalone spark file agrees on the
     direction and not the amount, drawing its ink 1.245 of 53 units high,
     2.07px at this scale; the button file is the one that shows the icon in
     place, so it wins. Matches how the label carries its own translateY. */
  /* 69.8 still: the new file draws the icon 42.13 units on its 261.21 pill,
     which is 69.80px here — the same number the previous file gave, so the
     size is unchanged and only where it sits and what colour it is move.
     -3.44, not -1.55: the new file rides the icon 2.08 units above the
     pill's centre (ink 24.56..66.64 against a 95.35 pill) where the old one
     rode it 0.93. Back: -1.55.
     The path itself is the same shape — the two files' icons differ by 0.5%
     in size and a translation, which the box already normalises. */
  .aichip svg.spark{width:69.8px;height:69.8px;flex:none;
                    transform:translateY(-3.44px);
                    color:var(--chip-ink,#0B57D0)}
  /* flex:none + pre, or the letter-spacing correction lets flex shrink and
     wrap the label once the chip scales up through the cut               */
  /* 60.4, fitted to the file's text ink: 226.0 wide at 60px and 229.8 at 61,
     so the file's 227.6 lands on 60.4. Scanned back off an exported frame it
     draws 227.5 x 45 against the file's 227.6 x 44.86, so it matches on both
     axes. Do not trust a cap-height metric here instead — reading the font's
     own cap rather than the drawn ink argues for 62.4, and that is 3% wide
     and pushes the text past where the file ends it. */
  .aichip b{flex:none;white-space:pre;font-size:60.4px;font-weight:400;
            line-height:1;color:var(--chip-ink,#0B57D0);transform:translateY(2px)}

  /* ============ ACT 2 — the AI Mode answer ============ */
  /* The card is white at full strength unless something sets --a2bg, which
     only the transparent mode does — see render(). On the plain card it is
     the flat #fff it has always been.                                    */
  #act2{position:absolute;inset:0;background:rgba(255,255,255,var(--a2bg,1));
        opacity:0;visibility:hidden}
  #act2 .row{position:absolute;will-change:transform,opacity}

  /* supplied G Logo1.svg — a 250x256 webp of the mark, cropped tight to it
     (opaque pixels reach all four edges), so it maps straight onto the
     box measured in the plate: x 67…138, y 64…137.                    */
  .gicon{left:67.5px;top:64.5px;width:71px;height:73px;
     background:var(--gmark)
                center/100% 100% no-repeat}
  /* nav: cap tops at y=88, each item pinned to its measured x            */
  .nav{left:0;top:79px;width:1920px;height:40px;
       font-size:35.34px;font-weight:400;color:var(--nav-ink);white-space:pre}
  .nav .it{position:absolute;top:0}
  .nav .it.on{color:#1f1f1f;font-weight:500}
  /* plate has the caret at y 99…108, 20px wide; it was sitting 3px high.
     Each caret takes its own label's colour — measured on the plate, the
     AI Mode pair is rgb(0,0,0)/rgb(16,16,16) and the More pair
     rgb(79,79,79)/rgb(87,87,87), so they match within the JPEG's noise. */
  .nav .car{position:absolute;top:18.5px;width:0;height:0;
            border:11.5px solid transparent;border-top-color:currentColor;
            border-bottom:0}
  .nav .car.on{color:#1f1f1f}
  /* Drawn as a DARKENING of the card rather than as an opaque bar of #ebebeb.
     Over white the two are the same thing — 255 x (1 - 0.0784) = 235.0, which
     is #ebebeb exactly, so the settled page is untouched — but they behave
     differently while the card is still fading up over footage or under a
     matte. An opaque light-grey bar can only ADD brightness to a card that is
     not white yet, so the line came out LIGHTER than the card it divides,
     which is the inverse of what it is for. A darkening keeps the
     relationship at every stage: whatever the card has reached, the rule is
     7.84% under it. `--rule` is kept as the colour it resolves to on white,
     for anything that wants to read the value.
     Back: `background:var(--rule)`. */
  .rule{left:240px;top:203px;width:1440px;height:2px;
        background:rgba(0,0,0,.0784)}
  .sideicon{position:absolute}
  /* Both glyphs are the new chrome's, measured off AIM Chat.svg at 1920:
     the menu rule pair spans x84-121 y297-312 (37x16) and the edit pencil
     x78-127 y399-441 (49x43). They share a centre line at x=102.5, which is
     what the left calcs are written around so --side-icon still trims them
     about their own centres rather than their corners. The old pair was a
     37x33 sparkle-and-lines mark and a 41x41 square; neither is in the new
     look, and the 425.5 departure the old edit box carried goes with it. */
  .sideicon.menu{width:calc(37px * var(--side-icon));
                 height:calc(16px * var(--side-icon));
                 left:calc(102.5px - 18.5px * var(--side-icon));
                 top:calc(305px - 8px * var(--side-icon))}
  .sideicon.edit{width:calc(49px * var(--side-icon));
                 height:calc(43px * var(--side-icon));
                 left:calc(102.5px - 24.5px * var(--side-icon));
                 top:calc(420.5px - 21.5px * var(--side-icon))}
  /* hugs its text so an edited query still reads as a chat bubble. Measured
     at the reference string: ink 903…1635 inside a pill 857…1679, i.e. 45px
     of padding and a right edge pinned 241px from frame right.           */
  /* The plate squares off the corner nearest the sender: scanning the fill
     boundary, the right edge reaches full width within 4px of the top while
     the left takes ~40px, and both bottom corners take ~40px too.        */
  /* The width follows the text. The bubble hugs whatever is typed and only
     wraps once it genuinely runs out of room, and the room is 1438: its right
     edge is pinned 241 from the frame's, and 241 is also where the answer
     column begins, so the widest it can get is that column's own span. A
     limit read off the layout rather than off one string — the plate's 43
     characters still sit on one row at 825, 72 fit on one at 1333, and it
     takes about 80 before there is nowhere to go but a second row.
     A row is 54px — the measured 102 less 24 of padding top and
     bottom, which is also the body's line-height ratio (1.414) at this size
     to within 0.05, so the single row still lands on 102 exactly.
     pre-wrap, not pre: it still keeps the query's own spacing, but now it is
     allowed to break. Lines set from the left as a chat bubble's do, while
     the bubble itself stays pinned to the right.                          */
  .qchip{right:241px;top:288px;max-width:1438px;padding:24px 45px;
         line-height:54px;
         background:var(--chip2);border-radius:51px 10px 51px 51px;
         display:grid;place-items:center start;
         font-size:38.22px;font-weight:400;color:#1f1f1f;
         white-space:pre-wrap;overflow-wrap:break-word}
  /* Flow layout, not absolute: the answer is editable, so the blocks have
     to push each other down. Column width 1290 reproduces the plate's line
     breaks for the reference copy (its longest line is 1279).            */
  .body{left:241px;top:460px;width:1290px;font-size:37.97px;
        font-weight:400;color:#000}
  .body p{line-height:53.7px;margin:0}
  .body p + p{margin-top:49.3px}
  /* the plate's heading stems measure 7.0px against 4.0px body — that is
     SemiBold, not Bold. At 700 it came out 8.0px, visibly too thick.     */
  /* Medium by request, against the plate's SemiBold. Its stems measure 7.0px
     on the x-height where the body's are 4.0 — a 1.75 ratio, which is what
     put it on 600; 700 came out 8.0 and visibly too thick. 500 is a step the
     other way, so this is a departure rather than a correction.          */
  .body h2{font-size:46.22px;font-weight:500;line-height:1;margin:50.7px 0 0}
  .body h2 + p{margin-top:49.3px}
  /* ── the page fades out at its foot ──────────────────────────────────
     AIM Chat_White.svg draws one rect over everything it has already
     painted: 0..1920 by 713..1080, filled with a vertical gradient from
     white at zero alpha to white at full — `x1 960 y1 713, x2 960 y2 1080,
     stop white/0 -> stop white/1`. It is the affordance that says the answer
     carries on below the frame, and both pieces' chat wants it.
     Frame-fixed, not part of the copy: it is tied to the viewport's foot
     rather than to the text, so it neither rises in with the answer nor
     scales out with it. In this piece that only means keeping it off `.row`;
     in the other it matters more, since the body there scales and smears on
     the way out and the fade must not go with it.
     The white carries --a2bg so the fade tops out wherever the card does.
     Over nothing that is 1 and this is the file's own rect; over footage or
     a matte the card is only partly there through the join, and a fade to
     solid white would have been the one opaque thing in a frame that is
     otherwise still letting the plate through. */
  .a2fade{position:absolute;left:0;top:713px;width:1920px;height:367px;
          pointer-events:none;
          background:linear-gradient(rgba(255,255,255,0),
                                     rgba(255,255,255,var(--a2bg,1)))}

  .w{color:#000}                       /* answer word, post-reveal */

  /* ── bullets, measured off NKE_Response1_1.svg ───────────────────────
     The reference's body margin is 241 — the same 241 both pieces use — its
     bullet is a disc of ink spanning x 263.88..273.11, so 9.25px centred on
     268.5, and the item's first line AND every line it wraps to begin at
     298. The type there measures a 27.21 cap, which against this font's
     0.72 cap ratio is 37.79px: piece 1's own 37.97 to within half a percent.
     Quoted as ratios of that size rather than baked, so the gutter follows
     the type instead of being pinned to one piece's setting:
       text indent    56.0 / 37.79 = 1.482em
       bullet centre  27.5 / 37.79 = 0.728em from the margin — which is half
                      the indent, so the disc sits mid-gutter
       disc          9.25 / 37.79 = 0.245em
       centre above the baseline
                     12.32 / 37.79 = 0.326em
     The disc is drawn as a box, not a "•": the diameter and the centre are
     then the measured ones rather than whatever the font happens to draw at
     whatever side bearing.
     The marker rides in the text flow as a zero-height inline-block instead
     of a ::before on the item, because in the search piece it has to be a
     `.w` — the reveal writes opacity onto those spans one line at a time,
     and a pseudo-element would sit at full strength before its own line had
     arrived. Zero height and baseline alignment mean it adds nothing to the
     line box; only its width, which the negative margin spends on the
     gutter. */
  .li{padding-left:1.482em}
  .li .bul{display:inline-block;width:1.482em;margin-left:-1.482em;
           height:0;line-height:0;vertical-align:baseline;position:relative}
  .li .bul::before{content:"";position:absolute;
       left:.728em;margin-left:-.1225em;      /* centred on the measured x */
       bottom:.2035em;                        /* .326 centre - half the disc */
       width:.245em;height:.245em;
       border-radius:50%;background:currentColor}
  /* Items sit tighter than paragraphs but not flush. Measured baseline to
     baseline across the reference's two item joins — 1049.45→1121.0 and
     1271.68→1343.0, so 71.55 and 71.32 against the 51.0 leading — the band
     between them is 20.43px, or 0.541em. The paragraph rule is more than
     twice that, so it has to be overridden rather than inherited. */
  p.li + p.li{margin-top:.541em}
  /* The context block is PRE-wrapped — wrapAt has already decided where the
     rows break — so each row is its own block and an item's indent is a flat
     padding on every one of them rather than a hanging one. Only the first
     row carries a disc, and the marker's negative margin spends the gutter
     back, so the same `.li` rule serves both. Row boxes stay at the block's
     own 1.4 leading, which is what keeps the three mask bands landing where
     they were measured. */
  .n-ctx .cl{display:block}

  /* ── the wordmark in flat white ──────────────────────────────────────
     The logo's five letters are drawn as glyph outlines filled from the
     brand variables, so white is a scoped redefinition of those four rather
     than a fill on the paths: the outlines are untouched and the ring, the
     beam and everything else that reads the same variables keep their own
     colours. Worth knowing before reaching for it — act 1 stands on a white
     card unless there is footage under it, and a white wordmark on white is
     nothing at all. It is for the footage and transparent modes. */
  #stage.logo-white .logo{--blue:#fff;--red:#fff;--yellow:#fff;--green:#fff}



  /* ══════════════ PIECE 2 — the prompt/response spot ═══════════════════
     A second, separate piece: a prompt box types a question over nothing,
     the page flashes white into an answer, and the answer's own words come
     back huge with a phrase lit inside them. 192 frames at the same 23.976,
     8.008s, measured off its own clip.
     Its opening is black in the reference, but black there means NOTHING —
     the plate is transparent and the compositor put it on black. So the
     stage is transparent and every export that can carry a matte gets one.
     Geometry, all measured: the box is 1066 x 297 centred on the frame at
     960,540 — its measured centre came out 959.2, 539.8 — with a 60px
     corner, which fits five points on the arc to within 0.4px.          */
  /* Piece 2 needs the footage behind it too, and the <video>/<img> live in
     piece 1's stage. Rather than run a second decoder, that stage stays in the
     layout with everything but the plate hidden and its own white turned off,
     so it is a plate holder and nothing else. It sits before #stage2 in the
     markup, so the footage lands under piece 2 without any z-index. */
  #stage.plate-only{background:transparent}
  #stage.plate-only > *:not(#bgvid):not(#bgimg){display:none}
  /* The context line's bottom edge and the clear space under it, named once so
     the action sheet cannot drift away from it. The block hangs off --ctx-bot
     and the four glyphs hang off --ctx-bot + --ctx-gap, so the distance
     between them is the same whatever the previous turn's length: nothing in
     act 1 carries an absolute y for either any more. 183 is 18 lower than the
     165 the plate measures, by request; 55 is what that leaves. */
  #stage2{position:absolute;inset:0;overflow:hidden;contain:strict;
          font-family:var(--font);background:transparent;
          --ctx-bot:183px; --ctx-gap:55px;
          opacity:0;visibility:hidden}
  #stage2.live{opacity:1;visibility:visible}
  /* the white card act 2 rises on; it is act 2's, not the stage's, so the
     transparency belongs to act 1 the same way it does in the other piece */
  /* The white page washes in UNDER act 1's furniture-turned-transparent and
     OVER nothing else: act 1 sits below it so its context line reads through
     the wash exactly as the plate's does (86 at full becomes 142 under a third
     of white), while the box rides above it, because the box is not covered —
     it becomes the chip. Hence the three z-indexes rather than tree order. */
  #n2page{position:absolute;inset:0;background:#fff;opacity:0;z-index:2}

  /* ── act 1 furniture ────────────────────────────────────────────────
     Laid out from the supplied design file, which agrees with the plate
     everywhere the two can be compared: the mark at (67,64) 72x73 against a
     measured 67..137 / 64..137; the rail glyphs at (84,292) and (84,402)
     against 84..119 / 293..324 and 84..122 / 403..441; the box at
     (426.01,389.58) 1067.86x300.24 against 425..1493 / 390..690; the mic at
     (1308.9,606.3) against 1309..1335 / 606..641. The design's own opacities
     check out too — #F0F2F5 at 50% over #0A0A0A at 35% predicts (122,123,124)
     for the + pill and the plate reads (119,120,123).                    */
  #n1{position:absolute;inset:0;z-index:1}
  /* The design puts a 30% #0A0A0A scrim with a 10px backdrop blur under
     everything. It only has work to do when there is footage behind it, and
     over nothing it lifts the whole frame by 3 — measured, the plate's empty
     background is a flat (0,0,0) and carrying the scrim regardless put the
     act at 8.1 against its 5.5. So it rides the footage. */
  #nscrim{position:absolute;inset:0;background:rgba(10,10,10,.3);opacity:0}
  /* the design's 10px backdrop blur, on its own switch: it is the expensive
     part of this look and not every plate wants it */
  #stage2.blur #nscrim{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .n-g{position:absolute;left:67px;top:64px;width:72px;height:73px;
       background:var(--gmark) center/contain no-repeat}
  /* The answer above the box is the tail of the previous turn — two lines of
     it, x-height 19.5 so 37px type, on a 48px pitch from x=258, and it fades
     going up: the lower line's ink peaks at 120 and the upper at 86. */
  /* Anchored by its BOTTOM edge, not its top. The previous turn reads
     upward into the past, so a longer one has to grow up and out of frame
     rather than down into the box; #stage2's overflow does the leaving.

     The ink starts from the design file, off "Common Confusion….svg" — a
     group carrying a LINEAR FILL and a LAYER BLUR — but both have since been
     specified per row, and per-row values are what the file's gradient has
     given way to. What survives of it is the shape of the idea: white type
     that recedes upward, dimmer and softer the further into the past it is.
     For the record, its fill ran (619.343,249.316) to (611.843,-114.184)
     across a 1433x138.4 block, white at 50% to #666666 at 50% at 62.706%
     along, and its blur was declared at `stdDeviation="0"`.

     COLOUR is the file's gradient, and it is a gradient rather than a value
     per row so that both ends of it show inside a single line: #ffffff at
     the block's bottom to #666666 at its top, clipped to the type. Over our
     155.4 of three rows that moves about 35 levels across each line's own
     height — 248 to 214 down row 1, 198 to 162 down row 2, 147 to 110 down
     row 3 — so the transition reads within a line and not only between them.
     White is anchored AT the bottom rather than where the file puts it. Its
     own vector starts white 110.89px BELOW the block, so the block never
     samples anything brighter than 181; that works on the light artboard the
     file is drawn on, where near-white is near-invisible, and inverts on the
     black this runs over, where white at the bottom is the whole point. The
     two colours and the direction are the file's; only that offset is not.

     OPACITY is flat per row on top of it: 60% on the bottom, 40% on the
     second, 20% on the third and above. The element carries the 60 — which
     is also the ceiling asked for, and the bottom row is what reaches it —
     so each band only has to scale it: 1, .6667, .3333. The two compound,
     which is the intent: a row further up is both greyer and fainter.

     `background-clip:text` is what carries the gradient, and the objection to
     it earlier — that it drops subpixel antialiasing — no longer applies,
     because this line is explicitly on greyscale antialiasing anyway. Both
     paths now render the same weight.

     BLUR is per row too: .5 on the bottom, 1 on the second, 1.5 on the
     third, 2 on a fourth. A CSS blur is uniform, so the line is drawn once
     per row and each copy masked to its own band. Bands rather than a
     crossfade: the amounts are per row rather than a gradient, and being
     disjoint they simply sum, with no correction for layers compositing as
     1-(1-a)(1-b).

     The band edges go where consecutive rows' BLURRED REACHES part, which is
     inside the gaps between them. The rows ink at 7..42, 58..94, 110..147
     and 162..198 up from the block's bottom, and reach 5.5..43.5, 55..97,
     105.5..151.5 and 156..204 at three sigma — so the edges sit at 73.25,
     125.25 and 177.75 in the box's own coordinates, each with clear air on
     both sides. That last one only has air at these amounts: at 2 and 3 the
     third and fourth reaches met exactly at 153, and at 4 and 5 they
     overlapped, so no edge could avoid clipping one or admitting the other.

     A fourth row never reaches a band anyway, because the copy is trimmed to
     three rows before it is set — see `n2CtxLines`. Masking one away is not
     enough: it would still be drawn and still blurred, and its ink reaches
     below its own box, which surfaced as a sliver at y18-24 on a six-row
     turn back when the third row carried 4px.

     And the whole thing sits in 24px of padding, which is what the visible
     limit was. A mask ends at its element's box and the box was exactly the
     text, so blur spilling off the first character was chopped at x=258:
     measured across it, 0 at 257 and 6.83 at 258, a straight vertical line
     down the left of the block. The padding is given back through `left`,
     `width` and `bottom`, so the type has not moved; every mask stop is
     quoted 24 higher because the box's bottom is now 24 lower.
     Back: `padding:0`, the stop sets 24 lower, and one layer. */
  .n-ctx{position:absolute;left:234px;width:1440px;padding:24px;
         bottom:calc(1080px - var(--ctx-bot) - 24px);
         opacity:.6;
         -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
         font-size:37px;line-height:1.4;font-weight:400;white-space:pre-wrap;
         color:transparent;
         background:linear-gradient(to top,#ffffff 24px,#666666 179.4px);
         -webkit-background-clip:text;background-clip:text}
  .n-ctx.r1{filter:blur(.5px);
         -webkit-mask-image:linear-gradient(to top,#000 73.25px,transparent 73.25px);
         mask-image:linear-gradient(to top,#000 73.25px,transparent 73.25px)}
  .n-ctx.r2{filter:blur(1px);
         -webkit-mask-image:linear-gradient(to top,transparent 73.25px,
             rgba(0,0,0,.6667) 73.25px,rgba(0,0,0,.6667) 125.25px,
             transparent 125.25px);
         mask-image:linear-gradient(to top,transparent 73.25px,
             rgba(0,0,0,.6667) 73.25px,rgba(0,0,0,.6667) 125.25px,
             transparent 125.25px)}
  .n-ctx.r3{filter:blur(1.5px);
         -webkit-mask-image:linear-gradient(to top,transparent 125.25px,
             rgba(0,0,0,.3333) 125.25px,rgba(0,0,0,.3333) 177.75px,
             transparent 177.75px);
         mask-image:linear-gradient(to top,transparent 125.25px,
             rgba(0,0,0,.3333) 125.25px,rgba(0,0,0,.3333) 177.75px,
             transparent 177.75px)}
  /* Drawn only if N2_CTX_ROWS is raised past 3; at 3 the copy never has a
     fourth row for this band to hold. Kept so that constant alone decides. */
  .n-ctx.r4{filter:blur(2px);
         -webkit-mask-image:linear-gradient(to top,transparent 177.75px,
             rgba(0,0,0,.3333) 177.75px,rgba(0,0,0,.3333) 228px,
             transparent 243px);
         mask-image:linear-gradient(to top,transparent 177.75px,
             rgba(0,0,0,.3333) 177.75px,rgba(0,0,0,.3333) 228px,
             transparent 243px)}
  .n-act{position:absolute;fill:#fff;opacity:.6}
  /* The previous turn, switched off: the context line and the action sheet
     UNDER it — copy, share, thumbs up, thumbs down — which are that answer's
     actions and belong to it rather than to the page. The MARK and the LEFT
     RAIL stay: they are the app's own furniture, present whether or not
     there is a previous turn to show.
     opacity, not display:none: .n-ctx is measured with getComputedStyle for
     its font when the context line wraps, and the action sheet is positioned
     off --ctx-bot, so the rows have to keep their layout even when nothing
     is drawn. Zero opacity also means zero in an alpha export, where
     display:none and a transparent element are the same picture. */
  #stage2.bare .n-ctx, #stage2.bare .n-act{opacity:0}
  /* the rail's two glyphs are the design file's own paths, kept in page
     coordinates so the viewBox is the measurement */
  .n-rail{position:absolute;fill:#fff;opacity:.6}

  /* ── the prompt box ──────────────────────────────────────────────────
     The wheel is the design's own angular gradient, seventeen stops from
     90deg, and it drives the ring, the halo and nothing else. A conic is the
     honest shape: the plate runs a full spectrum AROUND the perimeter, which
     a linear gradient cannot do however you rotate it. */
  /* The box's rect is written per frame through the morph, so these are only
     where it starts. z-index lifts it over the white wash. */
  #nbox{position:absolute;left:426.01px;top:389.58px;
        width:1067.86px;height:300.24px;z-index:3;border-radius:57px}
  /* face first, then the halo outside it, then the 2px ring on top */
  /* Two looks, both from the supplied files. Dark Blur is #0A0A0A at 35% with
     white type; White is an opaque white box with black type, its mic and +
     glyph dark and its send the blue. The box's geometry is the same in both —
     1067.86x300.24 at (426.02,389.58) — so only the skin changes.
     The radius is now shared too, at the dark file's 57, by request. Seach
     Query Box_White.svg draws its own on 69 (two stacked rects, rx 72.53 and
     69.03), which is what the white look used to carry; one radius across both
     looks means switching the Box control changes the skin and nothing else,
     and it also puts the halo's inner rect — a fixed 57 — back in agreement
     with the shape it is cut against. Back: 69 on both lines below. */
  .nface{position:absolute;inset:0;border-radius:inherit;
         background:rgba(10,10,10,.35)}
  /* The white box is solid; only the dark one is a 35% wash. They are different
     looks rather than the same wash in two colours — at 35% the white one
     renders as mid-grey over nothing and its black type loses most of its
     contrast against it. */
  #stage2.box-white .nface{background:#fff}
  #stage2.box-white #nq{color:#000}
  #stage2.box-white .nmic{fill:#0A0A0A;opacity:1}
  #stage2.box-white .nplus{opacity:1}
  #stage2.box-white #ncaret{background:#000}
  /* The halo is the box shape blurred and then cut off at the box's own
     edge, so none of it washes into the face — which is why the plate reads
     pure black inside. The cut is a mask rather than an opaque face, because
     the face is only 35% and would otherwise let the blur through.

     The OUTER edge used to be a cut as well, and that was the ring you could
     see. A mask ends where its element does, so a 70px halo around a 34px
     blur ended the glow at 70px whatever was left of it — profiled out from
     the box the level ran 8.7, 5.7, 3.7, 2.0 and then a flat 0 from 71,
     up, left and along the corner diagonal alike. A step of 2 is small but
     it is a step, at a fixed distance, all the way round: an edge, not a
     falloff, and full opacity made it plainer.
     140 is the room the blur actually wants. A CSS blur(34px) is sigma 34
     and carries to about 3 sigma, 102px, so at 140 the glow reaches nothing
     of its own accord and there is no boundary left to see.
     Everything inside is unchanged: `b` is still exactly the box's rect, so
     the halo's shape, its 57px radius and the wheel centred in it all sit
     where they did. Back: 70 / 127 / 70 / 70. */
  /* 197 = the box's own 57 plus the 140 bleed, the way .bargrad's 287 is
     117 + 170. */
  .nglow{position:absolute;inset:-140px;border-radius:197px;padding:140px;
         box-sizing:border-box;opacity:1;
         --gradient-angle:170deg;--mask-angle:-90deg;
         will-change:--mask-angle,--gradient-angle;
         -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
         mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
         -webkit-mask-composite:xor;mask-composite:exclude}
  /* 17, not 34. Profiled perpendicular to the card edge in
     NFL_Gatorade_15s_PromptResponse_01_V02_AB.mp4 — walking out from inside
     the face until it ends, then sampling every 3px — the clip's glow falls to
     half by 9-12px and is gone by 51-66. At 34 this build held half out to
     24px and carried to 72, and read about twice the clip's value at every
     distance: 45 against 21 at 30px out, 21 against 8 at 45. Half-width scales
     with sigma, so 24 -> ~10.5 puts it at 34 x 0.44 = 15, and the far tail fit
     wants 17; 17 is the rounder of the two and the one that measured back
     closest. The padding above stays 140 — it only has to be more than the
     blur can reach, and now it is by a wider margin. Back: blur(34px). */
  .nglow-mask{position:absolute;inset:140px;border-radius:57px}
  /* K_BOX = 300.234/112 * 1.3 = 3.485, the same rule the bar and the chip
     use: the source's blur keyframes carried onto this element's own height.
     The bar is 234 tall at 2.716 and the chip 158 at 1.834; this box is the
     largest of the three at 300.2. The blur is written per frame from the
     same track, so the value here is only what it holds before the first
     render. */
  #stage2 .gblur{filter:blur(3.49px)}
  #stage2 .gblur.tip{filter:blur(3.49px)}
  /* Fitted to this box's aspect, not inherited. The squash is what maps the
     mask's window onto a share of the perimeter, and it has to track the
     shape: the bar's 7 is fitted to its 10.9 aspect, the chip's 2.2 to its
     2.88. This box is 1067.86 x 300.234, aspect 3.56 — nearer the chip than
     the bar — and 2.6 is that interval's own value, 2.2 + (3.56-2.88) /
     (10.9-2.88) x (7-2.2). It was briefly 5.6, fitted to an 8.77 that came
     from measuring the wrong element. */
  /* The source's composit-clip is DISABLED here — overridden to solid black,
     so the intersect it feeds becomes a no-op while the structure stays the
     bar's. Measured reason, not taste: the clip is a fixed notch (it has no
     `from`, so it never turns), and against this element's 92%-wide window it
     pinned the visible gap at perimeter fraction 0.945..0.315 — the left side
     and top-left corner — at EVERY mask angle from 0 to 345. The travelling
     window's own gap was reduced to a second, smaller hole, which is why the
     rotation read as missing. On the bar the window is 39% wide and the clip
     rarely intersects it; here it always does. */
  #stage2 .gblur{--composit-clip:conic-gradient(#000 0 100%)}
  #stage2 .gmask{scale:2.6 1.5;
       /* Much wider than the source's, fitted to a supplied still of how the
          glow should sit round the box: lit across the top and down most of
          both sides, with the bottom edge clear.
          The target is ~51%, worked out from the picture rather than guessed
          at — on a box this wide the top and bottom edges are 39% of the
          perimeter EACH and the sides only 11%, so "the top and most of both
          sides" is 39 + 7.7 + 4.4. An eyeball of the image reads like two
          thirds of the way round; the arithmetic says half, and the arithmetic
          is what the mask has to hit.
          With the wheel now opaque — the source's, blue wrapping to blue —
          the WINDOW is what shapes the band again, so the near-fully-open
          5/12/97/100 that suited the alpha-faded wheel would light the whole
          ring. The chip's 28/44/88/99 is the width that measures nearest the
          reference distribution here.
          Back: 5/12/97/100 for the faded-wheel pairing, or the source's
          50/68/75/89. */
       -webkit-mask-image:conic-gradient(from var(--mask-angle),
           transparent 0%,transparent 28%,#000 44%,#000 88%,transparent 99%),
           var(--composit-clip);
       mask-image:conic-gradient(from var(--mask-angle),
           transparent 0%,transparent 28%,#000 44%,#000 88%,transparent 99%),
           var(--composit-clip)}
  /* The wheel is not a screen-space sweep. It is drawn on a SQUARE and then
     squashed — which is why the whole top edge comes out one blue while the
     entire spectrum crowds along the bottom — and it runs anticlockwise, hence
     the -1 on x. A plain conic on the box puts the warm half up the left-hand
     side instead.

     The squash is 0.436, fitted rather than assumed. The design file's own
     transform implies the box's aspect, 0.2812, but at that value the hues
     land about 120px left of the plate's along the bottom edge: matching
     colours at 124 points around the perimeter over a grid of squash and
     phase picks 0.436, and the per-frame phase then fits a line to 1.15 deg
     against 3.4 at 0.2812. Back: 0.281159 for the design file's value.

     There is no crisp outline on the box, only this bloom. Measured across the
     edge in PromptBox_20260819.mp4, the profile steps from the glow at 23-29
     straight to the face at 255 with nothing but a 1-2px antialias between —
     the colour lives entirely outside the box.

     The bloom runs at FULL opacity by request, against the .65 that had been
     fitted to that clip. Seach Query Box_Dark Blur.svg draws the glow as two
     stacked layers — a 50-blur one at opacity .5 on the box's own rect and a
     37-blur one at opacity 1 on a shorter 1070x249 — so 1 is the file's own
     value for the brighter of them, and this single fitted layer takes it.
     The cost is stated rather than hidden: at .65 the profile read 43-45 at
     2px out and 25-26 at 20, against the clip's 38-53 and 18-29; at 1 it is
     half again as bright and sits above that measured band. The face is
     untouched, because it already carries the file's number — #0A0A0A at
     fill-opacity .35, which is what `.nface` has always been.
     Back: .65 here and `0.65 * ring` in render2. Correlating the whole perimeter
     between its frames puts the bloom's own rotation at 1.178 samples a frame
     with 0.32 rms, about 1.24 deg, which is the 1.149 already fitted off the
     other clip. */
  /* The wheel is the bar's geometry now — a circle the size of the layer,
     rotated by --gradient-angle — rather than a 1067.86 square squashed by
     0.436 and mirrored. The squash moved to .gmask above, which is where the
     bar puts it; mirroring is gone with it, the travelling arc having a
     direction of its own. The old pair is in the departures table. */
  #stage2 .gmask i{position:absolute;inset:0;border-radius:50%;aspect-ratio:1/1;
           translate:0 -50%;inset-block-start:50%;
           rotate:var(--gradient-angle);
           backface-visibility:hidden;transform:translate3d(0,0,0)}
  /* 39, not the design file's 32: down 7px by request */
  #nq{position:absolute;left:45.58px;top:39px;width:960px;
      font-size:44px;line-height:1.2;font-weight:400;color:#fff;
      white-space:pre-wrap;overflow-wrap:break-word}
  /* 40.128 is the design file's own caret — it draws it from y 434.73 to
     474.858, which is about 2px above the text's ascender and 5px below its
     baseline. The plate renders it at 32, only ascender-to-baseline, and that
     is what this used to be; longer by request, and the file is where the
     longer number comes from. */
  #ncaret{display:inline-block;width:3.4px;height:40.13px;background:#fff;
          vertical-align:-8px;margin-left:6px}
  #ncaret.off{opacity:0}
  /* The three controls hang off the box's BOTTOM edge, at the insets the
     design puts them at — 30.41, 47.21 and 30.38 below it. They were written
     from the top, which is the same thing at the resting height and pins them
     under the text once the box grows a line. */
  /* Add.svg, used as it is drawn: a 94.2012x70.6509 pill on a 35.3254 radius
     in #F0F2F5, with the file's own + path over it in #0A0A0A. The path is
     kept in the file's coordinates and the viewBox is set to the pill's rect,
     so the viewBox IS the measurement — the same way the mic and the rail
     glyphs are carried. It replaces two CSS bars that reproduced the same
     plus to within a tenth of a pixel; the file is simply the better source.
     The 50% is on the WHOLE button rather than on the pill's fill, which is
     how box_dark.svg groups it — <g opacity="0.5"> around both the rect and
     the glyph — and it means the + dims with its pill instead of staying a
     hard black over a half-strength ground. */
  .nplus{position:absolute;left:30px;bottom:30.41px;
         width:94.2012px;height:70.6509px;border-radius:35.3254px;
         background:#F0F2F5;opacity:.5}
  .nplus svg{position:absolute;inset:0;width:100%;height:100%;fill:#0A0A0A}
  .nmic{position:absolute;left:882.91px;bottom:47.21px;
        width:27.5px;height:36.32px;fill:#F8F9FA;opacity:.5}
  /* pale until the query lands, then the design's blue — the plate goes
     (255,255,255) at f31 to (74,104,225) by f45, and #346BF1 is the design's
     own value for that end */
  /* overflow:hidden so the energy blob stays INSIDE the pill. The blob is
     inset 9.8px and blurred 13.7px, which carries roughly 41px past its own
     box — about 31px outside the button — and it lifts 15px on top of that,
     so unclipped it washed onto the page around the button rather than
     lighting the button. Clipping follows the border-radius, so the bloom
     takes the pill's own shape. */
  .nsend{position:absolute;left:943.8px;bottom:30.38px;
         width:94.29px;height:70.72px;border-radius:35.36px;
         background:#e7e7e7;display:grid;place-items:center;overflow:hidden}
  .nsend svg{width:31.43px;height:31.43px;fill:#1f1f1f;
             transform-origin:bottom;will-change:transform}
  /* the supplied .button-energy: a blurred blue blob inset inside the button
     that lifts out of it as it is pressed. Its inset and blur are scaled from
     the 48x36 the source is written against to this button's 94.29x70.72. */
  /* A TOP-ANCHORED bloom, measured off SendButton_20260819.mp4 rather than
     guessed. The clip's button is 190x142 — exactly 2x this one — and the lit
     area is not a blob in the middle of the pill: read as white-over-base
     alpha down the button it runs .23 .21 .18 .16 .11 .06 .01 and is GONE by
     70%, so it is brightest against the top edge and decays from there. The
     old element was a box inset 9.8px and blurred 13.7px, which put its peak
     at the button's CENTRE (measured .75 at 50% down, still .25 at 90%) and
     lit the whole pill.
     A radial gradient centred on the top edge reproduces the falloff without
     relying on a blur to shape it; the small blur that remains only kills the
     banding. Horizontally the clip runs 0 .09 .22 .29 .37 .30 .23 .09 0
     across the top band, a soft hump reaching nothing at either end, which is
     what the 64% x-radius is fitted to. Opacity per frame from ENERGY_PEAK. */
  /* The stops are FITTED to the clip's row means rather than chosen. Read as
     white-over-base alpha and normalised to its own peak, the clip runs, down
     the button: .93 at 3%, 1.00 at 8%, .99 at 14%, .93 at 20%, .82 at 28%,
     .65 at 36%, .50 at 44%, .35 at 52%, .15 at 60%, .05 at 68%, ~0 by 76%.

     So it is a PLATEAU then a long fall, not a peak. The light holds full
     from the top edge to about 14% down before it begins to go, and it does
     not finish until 76% — a 68% radius ended it at 60% and read as too
     small and too abrupt. The dip in the clip's own top row (.93 at 3%) is
     its antialiased edge, not a dip in the light, so the centre stays ON the
     top edge and the plateau does the work; putting the centre at 10% to
     chase that number pushed the whole distribution down and measured 1.3x
     too bright through the middle. Radius 78% ends it where the clip does.
     The element runs 12px ABOVE the button (inset -12px on top) so the blur
     has material there instead of averaging the plateau into nothing; the
     button's overflow:hidden throws that overhang away. With the box 12px
     taller the button's own top edge sits at 14% of it, which is where the
     gradient centre goes, and the 78%-of-BUTTON reach becomes 67% of the
     taller box. Without this the top rows measured .58 and .77 of the clip
     at 3% and 8% — the light started below the edge instead of on it. */
  .nenergy{position:absolute;inset:-12px 0 0 0;border-radius:inherit;
           background:radial-gradient(90% 67% at 50% 14%,
                     rgba(255,255,255,1) 0%,     rgba(255,255,255,1) 18%,
                     rgba(255,255,255,0.93) 26%, rgba(255,255,255,0.82) 36%,
                     rgba(255,255,255,0.65) 46%, rgba(255,255,255,0.50) 56%,
                     rgba(255,255,255,0.35) 67%, rgba(255,255,255,0.15) 77%,
                     rgba(255,255,255,0.05) 87%, rgba(255,255,255,0) 100%);
           filter:blur(5px);opacity:0;pointer-events:none}

  /* ── act 2, the answer page ─────────────────────────────────────────
     Every number here is off the plate's f70. The mark is 72px square at
     (66,65); the nav's ink band runs y 87..121 and its items start at 242,
     483, 585, 761, 933 and 1150 with carets at 401 and 1253; the rule is at
     207; the chip is 711x99 at (969,291) with its text inset 45; the body
     starts at x=241 on a 51px pitch, and its last paragraph is grey rather
     than black — 154,154,154 against the others' 0. */
  #n2{position:absolute;inset:0;opacity:0;z-index:4}
  .n2logo{position:absolute;left:66px;top:65px;width:72px;height:73px;
          background:var(--gmark) center/contain no-repeat}
  .n2nav{position:absolute;left:0;top:87px;width:1920px;height:44px;
         font-size:36px;line-height:36px;color:#54585c}
  .n2nav span{position:absolute;top:0}
  .n2nav .on{color:#1e1f22}
  /* currentColor, not a baked #1e1f22: each caret belongs to the item beside
     it, so it takes that item's colour. AI Mode is the selected tab and reads
     #1e1f22, while More sits in the strip's own #54585c — with the colour
     baked in, More's caret was drawn in the SELECTED tab's near-black and read
     as a darker mark than the word it belongs to. */
  .n2nav i{position:absolute;top:14px;width:0;height:0;border:9px solid transparent;
           border-top:9px solid currentColor;border-bottom:0}
  .n2rule{position:absolute;left:240px;top:207px;width:1500px;height:2px;
          background:#d5d5d8}
  .n2rail{position:absolute;fill:#56595E}
  /* The bubble hugs its text, the same rule the other piece's does: pinned by
     its RIGHT edge and grown leftward, so a longer prompt reaches back toward
     the answer column instead of running off the frame. Two sources agree on
     which edge is the anchor — AIM Chat_White.svg draws the bubble 861..1680
     for its own string, the plate 969..1680 for this one. Two lengths, one
     right edge, 240 in from the frame's.
     The widest it can get is 1439, where its left edge meets the answer
     column at 241 — the limit read off the layout rather than off a string.
     A row is 99: the plate's own height, and also 24 of padding either side
     of the body's 51px line, so the single row still lands on 99 exactly.
     The corners are the design file's path — 49.5 / 10 / 60 / 49.5, squaring
     the one nearest the sender, where this had assumed a plain 45 pill. */
  .n2chip{position:absolute;right:240px;top:291px;max-width:1439px;
          padding:24px 45px;line-height:51px;
          border-radius:49.5px 10px 60px 49.5px;background:#f0f1f4;
          font-size:36px;color:#1f1f1f;white-space:pre-wrap;
          overflow-wrap:break-word;display:grid;place-items:center start}
  .n2chrome{position:absolute;inset:0}
  .n2body{position:absolute;left:241px;top:452px;width:1300px;
          font-size:36px;line-height:51px;color:#000}
  .n2body p{margin:0}
  .n2body p + p{margin-top:42px}
  .n2body b{font-weight:500}          /* 4px stems against the text's 3 */
  /* The plate greys this last line — measured (154,154,154) against the
     paragraphs above it reading 0, because on the reference it is still
     arriving. Black by request, so the answer is one colour throughout:
     every paragraph, the heading in the other piece and the revealed words
     all sit on #000 and this now does too. It keeps its class, which is what
     the trailing-line field writes into and what act 3 skips when it builds
     the wall. Back: color:#9a9a9a. */
  .n2body .tail{color:#000}
  /* the same rect off AIM Chat_White.svg — 713..1080, white 0 to white 1.
     A sibling of the body rather than a child, because the body is what
     scales and smears out of frame at f80 and this belongs to the frame.
     Plain white here: this page covers the footage completely, so there is
     no --a2bg to follow. */
  .n2fade{position:absolute;left:0;top:713px;width:1920px;height:367px;
          pointer-events:none;
          background:linear-gradient(rgba(255,255,255,0),#fff)}

  /* ── act 3, the words come back huge ───────────────────────
     Measured on the plate's settled frame: the lit line's x-height is 82px and
     its ascender-to-baseline 120px, so the type is 156px; the four visible rows
     sit 207px apart, so 1.33 leading. The body is thrown out of focus — a stem
     there rises over 55px against the lit line's 13 — and the lit phrase sits
     *inline in that same paragraph*, not on a caption line under it.

     So the page is drawn three times over at identical metrics and one shared
     transform: a blurred dim copy, a sharp copy carrying the live phrase, and a
     third carrying the far end of the glow's gradient. The plate's letters are
     white all along (251,254,253 at both ends) — only the halo runs through the
     wheel, so the colour lives entirely in text-shadow. */
  #n3{position:absolute;inset:0;opacity:0;z-index:5}
  /* 4900px is the width that reproduces the plate. It puts both lit phrases on
     one row 1693px apart — the plate's two rest positions measure ~1722 apart,
     and its wall grid does not shift vertically by a single pixel across the
     whole of act 3, so the swap has to be a purely horizontal move. It also
     leaves ~950px of copy to the right of the second phrase, so the block's
     own edge never walks into frame the way a narrower wall's does. */
  .n3page{position:absolute;left:0;top:0;width:4900px;
